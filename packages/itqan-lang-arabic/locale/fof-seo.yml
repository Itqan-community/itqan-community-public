      configure_seo: السماح بإعداد SEO
      category_label: SEO
    header:
      title: تحسين محركات البحث
      tools: الأدوات
      health_check: فحص السلامة
      seo_settings: إعدادات SEO
      sitemap_info: معلومات خريطة الموقع
      search_engines_info: معلومات محركات البحث
      setup_ssl: إعداد SSL
    dashboard:
      widget:
        review_prompt: حان وقت مراجعة إعدادات SEO الخاصة بك!
        cta: أجرِ فحص السلامة!
    modals:
      crawl_post:
        title: إعدادات زحف المنشورات
        intro: <b>اقرأ هذا الحوار بعناية.</b> لن تُنفَّذ هذه الوظيفة إلا عند تحديث الصفحة في نقاش ما. ويمكنك دائمًا تغيير هذا الخيار لاحقًا.
        mode_main_title: فهرسة المنشور الرئيسي فقط (الافتراضي)
        mode_main_help: سيعرض محرك البحث المنشور الرئيسي فقط في نتائج البحث. ولن يؤثر ذلك على سرعة التحميل عند الانتقال إليه عبر روابط المنتدى.
        mode_all_title: فهرسة جميع المنشورات في النقاش (الإعداد مفعّل)
        mode_all_help: ستفهم محركات البحث النقاشات، بل يمكنها عرض بعض المنشورات ذات الصلة أسفل نتائج البحث. وإذا كانت إضافة '<a>أفضل إجابة</a>' مثبّتة ومفعّلة في منتداك، فستضع النقاش في نتائج البحث بوصفه «تمت الإجابة عليه» وتوجّه المستخدم إلى ذلك المنشور تحديدًا. كما يُعرض كل رد مع عدد الإعجابات والتصويتات الإيجابية، لتتمكن محركات البحث من تحديد الردود الأكثر إفادة حتى بدون إضافة أفضل إجابة. <b>غير أن ذلك قد يكون أثقل بحسب إعدادات خادمك</b>. فقد يستهلك بعض الأداء، لذا يعتمد تفعيل هذه الميزة على سرعة خادمك.
        question: هل تريد تفعيل هذه الميزة؟
        switch_label: الزحف إلى جميع المنشورات (أبطأ عند تحديث الصفحة، لكن نتائج البحث ستكون أفضل)
      dofollow:
        title: قائمة do-follow
        intro: أدخل <b>أسماء المضيفين</b> للنطاقات التي تريد إضافتها إلى قائمة do-follow.
        default_note: يُضاف النطاق الذي تستخدمه لنسخة Flarum الخاصة بك إلى القائمة افتراضيًا.
        learn_more_line: <a>اعرف المزيد</a> عن قائمة do-follow.
        add_placeholder: السماح بنطاق
        duplicate_error: هذا النطاق موجود بالفعل في قائمة do-follow.
    settings:
      keywords:
        heading: الكلمات المفتاحية للمنتدى
        help: أدخل كلمة مفتاحية واحدة أو أكثر تصف منتداك.
        placeholder: أضف بعض الكلمات المفتاحية
        comma_note: 'ملاحظة: افصل بين الكلمات المفتاحية بفاصلة.'
        example: 'مثال: flarum، تطوير الويب، منتدى، تفاح، أمن'
      info:
        overview: تحتوي هذه الصفحة على بعض الإعدادات الأخرى من أنحاء لوحة الإدارة. ومع ذلك، من الجيد أن تكون لديك نظرة عامة جيدة على هذه الإعدادات. ولا تنسَ إجراء فحص SEO.
        maintain: راجع جميع إعداداتك عند إعداد هذه الإضافة لأول مرة، وحافظ عليها للحصول على أفضل نتائج بحث.
      twitter_card:
        heading: حجم بطاقة X (تويتر سابقًا)
        help: عند مشاركة منتداك على X (تويتر سابقًا)، ستظهر له صورة (إن كانت صورة وسائل التواصل الاجتماعي قد أُعدّت). ويمكن أن تكون بطاقة كبيرة بصورة كبيرة، أو بطاقة صغيرة (ملخّص) بصورة أصغر.
        option_large: بطاقة كبيرة (صورة كبيرة)
        option_summary: بطاقة ملخّص (صورة أصغر)
      social_media_image:
        heading: صورة وسائل التواصل الاجتماعي
        help_size: يُفضّل صورة مربعة، والحجم الموصى به 1200x1200 بكسل. وإلا فاستخدم صورة أفقية بالحجم الموصى به 1200x630.
        help_usage: تستخدم وسائل التواصل الاجتماعي هذه الصورة عندما يشارك مستخدم صفحة من موقعك (Facebook، X (تويتر سابقًا)، Reddit).
      crawl:
        heading: إعدادات زحف منشورات النقاشات
        help: هذا إعداد مهم يتعلق بزحف منشورات نقاشاتك في نتائج البحث.
        button: إعداد إعدادات زحف المنشورات
      indexing:
        heading: عناصر التحكم في الفهرسة
        profiles_label: إزالة صفحات الملفات الشخصية من الفهرسة
        profiles_help: عند التفعيل، تُصدر صفحات الملفات الشخصية للمستخدمين وسم ميتا «noindex» لتبقى خارج نتائج البحث. ويظل تتبّع الروابط في الصفحة ممكنًا، فيستطيع الزواحف الوصول إلى المحتوى الذي تشير إليه.
        tags_help: ستُبقى النقاشات في الوسوم المحددة (وصفحات قوائم تلك الوسوم نفسها) خارج نتائج البحث عبر وسم ميتا «noindex». ويظل تتبّع الروابط ممكنًا. واختيار وسم أب يغطي أيضًا الوسوم الفرعية التابعة له.
        tags_button: تحديد الوسوم
        tags_none_selected: لا توجد وسوم مستبعدة من الفهرسة.
      nofollow:
        heading: روابط nofollow
        help: تتلقى جميع الروابط إلى النطاقات الخارجية سمة '<i>nofollow</i>' افتراضيًا. وهذا يضمن ألا يملأ الناس منتداك بروابط إلى نطاقات أخرى بهدف جذب زيارات.
        help_dofollow: يتيح لك هذا الإعداد إضافة نطاقات إلى قائمة do-follow. على سبيل المثال، يمكنك إضافة <i>flarum.org</i> لتضمن ألا تتلقى الروابط إلى هذا الموقع سمة nofollow.
        button: فتح قائمة do-follow للنطاقات
      new_tab:
        heading: فتح الروابط الخارجية في تبويب جديد
        help: ستضمن هذه الإضافة أيضًا أن الروابط الخارجية (إلى نطاقات أخرى) تُفتح في تبويب جديد. ولا يمكن تعطيل هذا الإعداد حاليًا.
      updated:
        heading: هل حدّثت هذا الإعداد؟
        help: عندما ترى أنك جاهز، انقر الزر أدناه لإعادة التحقق من حالة هذا الإعداد.
        button: العودة إلى النظرة العامة وإعادة التحقق
    pages:
      search_engines:
        heading: أرسل موقعك إلى محركات البحث
        intro: من الممارسات الجيدة أن تعرّف محركات البحث بوجود موقعك. وستوجهك هذه الصفحة للقيام بذلك بنجاح.
        sitemap_tip: يُوصى بأن تكون خريطة الموقع جاهزة قبل إكمال هذا الدليل. وإن لم تكن لديك خريطة موقع بعد، <a>انقر هنا لمعرفة المزيد عنها</a>.
        google_heading: أضف موقعك إلى نتائج بحث Google
        google_visit: إذا أردت إضافة موقعك إلى نتائج بحث Google، فزُر {link}. وستحتاج إلى إضافة موقعك وإثبات أنك مالك اسم النطاق المرتبط به.
        google_www: 'عند إدخال نطاقك، عليك أن تجيب عن السؤال التالي: هل تريد استخدام النطاق الفرعي «www» في نتائج البحث؟ <strong>لا</strong> يمكنك تغيير ذلك لاحقًا. وتسجيل نطاقك في Google Search Console عدة مرات لن يحسّن ترتيبك.'
        google_sitemap: بعد إكمال التسجيل في Google Search Console، زُر صفحة <b>Sitemaps</b>. ومرّر ملف <b>sitemap.xml</b> إلى Google. وتأكد من أن Google تستطيع الزحف إلى خريطة موقعك وأنها ستواصل ذلك.
        bing_heading: أضف موقعك إلى نتائج بحث Bing
        bing_visit: إذا أردت إضافة موقعك إلى نتائج بحث Bing، فزُر {link} وأكمل الخطوات المطلوبة. وليست كل الحقول إلزامية.
        bing_sitemap: لا تنسَ إعداد رابط خريطة موقعك. وبعد التحقق من موقعك تكون قد انتهيت، وسيفهرس Bing موقعك.
        yandex_heading: أضف موقعك إلى نتائج بحث Yandex
        yandex_visit: إذا أردت إضافة موقعك إلى نتائج بحث Yandex، فزُر {link} واتبع الخطوات المطلوبة.
        yandex_sitemap: لا تنسَ إعداد خريطة الموقع في Yandex.Webmaster.
        yahoo_heading: أضف موقعك إلى نتائج بحث Yahoo
        yahoo_body: إذا أردت إضافة موقعك إلى نتائج بحث Yahoo، فأكمل تسجيل موقعك في نتائج بحث Bing. وستستخدم Yahoo تلك البيانات.
        confirm_button: لقد قرأت هذا
      sitemap:
        why_heading: لماذا ينبغي أن تستخدم خريطة موقع؟
        why_body: خريطة الموقع ملف XML يحتوي قائمة بجميع الصفحات المتاحة على موقعك. ويستخدمها الزواحف ومحركات البحث للعثور على صفحات موقعك.
        generated_note: يُنشأ ملف خريطة الموقع تلقائيًا ولا يحتاج إلى أي صيانة.
        which_extension_heading: ما الإضافة التي ينبغي أن أثبّتها؟
        which_extension_body: '{link} هي الإضافة المقترحة للتثبيت في Flarum. ونوصيك بشدة بتثبيتها وتفعيلها.'
        which_extension_details: ستضمن هذه الإضافة أن يجد الزواحف <b>نقاشات</b> منتداك، و<b>الوسوم</b> (عند تفعيل الإضافة)، وإضافة <b>Pages</b> (عند تثبيتها وتفعيلها). وستوفر ملف sitemap.xml تلقائيًا.
        robots_heading: وماذا عن robots.txt؟
        robots_body: تولّد الإضافة نفسها أيضًا ملف <b>robots.txt</b> لمنتداك. ويخبر هذا الملف محركات البحث بالمناطق المسموح لها بالزحف إليها ويوجّهها إلى خريطة موقعك، لذا يغطي تثبيتها الملفين معًا — ولا يبقى شيء إضافي للإعداد.
        just_installed_heading: ثبّت الإضافة للتو
        just_installed_body: في هذه الحالة، فعّلها بالنقر على الإضافة في الشريط الجانبي على اليسار. وعندئذٍ سيختفي هذا التحذير.
      ssl:
        intro_heading: لماذا أحتاج إلى اتصال آمن؟
        intro_body: يتزايد الوعي بالأمن والخصوصية على الويب. و<b>يكاد كل</b> مطوّر أو مالك موقع يريد أن يكون موقعه آمنًا لزواره، فلا يخشون تعرّض بياناتهم للاختراق من قراصنة أو منتحلي هوية المواقع.
        rankings_heading: محركات البحث {icon} الاتصالات الآمنة
        rankings_body: إذا لم يكن لموقعك اتصال آمن، فستخفض محركات البحث ترتيبه كثيرًا مقارنة بالمواقع الأخرى، أو لن تفهرسه أصلًا.
        rankings_body_ssl: عندما يتوفر SSL، يحصل موقعك على ترتيب أعلى ويُفهرس.
        what_heading: ما هو SSL أو TLS؟
        what_body: 'يعرف معظم الناس <b>https</b> المستخدم للاتصالات الآمنة باسم SSL: <i>Secure Sockets Layer</i>. واسمه الرسمي TLS: <i>Transport Layer Security</i>. وتُستخدم هذه الطريقة لإنشاء اتصال آمن بخادم الويب الخاص بك، ما يمنع المهاجمين أو خوادم ويب أخرى من انتحال هوية موقعك ويحافظ على سلامة زوارك. وإذا حدث ذلك، يُقطع اتصال SSL وستحذّر متصفحات الزوار من أن الاتصال غير موثوق.'
        how_heading: كيف تضيف SSL إلى موقعك؟
        how_body: لمن يستخدمون استضافة ويب، الطريقة الأكثر شيوعًا هي الدخول إلى لوحة الاستضافة، ثم الانتقال إلى إعدادات الاستضافة لموقعك والنقر على SSL. ويمكنك اتباع الخطوات لإضافة SSL إلى موقعك. ومعظم شركات الاستضافة اليوم تدعم جهة إصدار الشهادات الشائعة {link}.
        added_heading: حسنًا، أضفت SSL!
        added_body: رائع! الآن عدّل <b>config.php</b> وغيّر <b>'url'</b> إلى <b>https</b>!
        no_ssl_heading: ماذا لو لم أرد إضافة SSL؟
        no_ssl_body: في هذه الحالة، يمكنك إلغاء تثبيت هذه الإضافة، لأن محركات البحث <b>لن تفهرس منتداك</b> أو سترتيبه أدنى بكثير من المواقع الأخرى لأسباب أمنية.
      health:
        legend: للحصول على أفضل نتائج محركات البحث، تأكد من أن جميع الفحوصات خضراء.
        default_button: تحديث الإعداد
        table:
          technique: التقنية
          status: الحالة
        status:
          warning: تحذير!
          passed: كل شيء جاهز!
        checks:
          description:
            label: يتحقق مما إذا كان لمنتداك وصف
            reason_missing: لم تُعدّ وصفًا للمنتدى بعد!
            reason_default: لم تغيّر وصف المنتدى الافتراضي بعد التثبيت!
            reason_too_short: وصف منتداك أقل من 20 حرفًا. يُرجى توسيعه للحصول على نتائج بحث أفضل.
            button: تحديث الوصف
          keywords:
            label: يتحقق مما إذا كانت هناك كلمات مفتاحية معدّة لمنتداك
            reason: لم تُعدّ كلمات مفتاحية للمنتدى بعد!
            button: تحديث الكلمات المفتاحية
          ssl:
            label: يتحقق مما إذا كان موقعك يوفر اتصالًا آمنًا (SSL/TLS)
            reason: لا يفرض منتداك اتصال SSL/TLS (اتصالًا آمنًا بموقعك). ومعظم محركات البحث لن تفهرس موقعك أو ستخفض ترتيبه إن لم يكن هناك اتصال آمن متاح.
            button: كيف تُعدّ SSL
          crawl:
            label: راجع إعدادات زحف منشورات النقاشات
            reason: ستحتاج إلى مراجعة هذا الإعداد لتجاوز الفحص.
            button: مراجعة إعدادات المنشورات
          social_media:
            label: إعداد صورة لوسائل التواصل الاجتماعي
            reason: لم تعيّن صورة لوسائل التواصل الاجتماعي لمنتداك. ويُوصى بتعيين واحدة. وسيُستخدم رمز الموقع (favicon) الآن كمعاينة على وسائل التواصل الاجتماعي.
            button: تحديث الصورة
          sitemap:
            label: يتحقق مما إذا كانت خريطة الموقع متاحة لمنتداك
            reason: يُوصى بشدة بتثبيت إضافة FriendsOfFlarum Sitemap!
            button: اقرأ المزيد عن إضافة خريطة موقع
          robots:
            label: يتحقق مما إذا كان ملف robots.txt متاحًا لمنتداك
            reason: توفّر إضافة FriendsOfFlarum Sitemap ملف robots.txt الخاص بك. ثبّتها وفعّلها ليتوفر ملف robots.txt لمحركات البحث.
            button: اقرأ المزيد عن إضافة robots.txt
          meta_tags:
            label: يتحقق مما إذا كانت وسوم الميتا متاحة لمنتداك (مولّدة بواسطة هذه الإضافة)
          search_engines:
            label: سجّل منتداك في محركات البحث
            reason: ستحتاج إلى مراجعة ذلك لتجاوز الفحص.
            button: مزيد من المعلومات
          review:
            label: راجع إعدادات SEO كل شهرين. والمراجعة التالية المطلوبة في {date}
            reason: حان وقت إعادة مراجعة إعدادات SEO الخاصة بك.
            button: حسنًا! راجعتها!
