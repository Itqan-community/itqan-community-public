      image: قالب تنزيل الصور الافتراضي
      image_description: "يعرض صورة مصغّرة للصورة ويمرّر التنزيل عبر php، ما يتيح جمع الإحصاءات والحماية من الربط المباشر.\n"
      image-preview: قالب معاينة الصورة الكاملة
      image-preview_description: "يعرض الصورة كاملة داخل المنشور. لا وظيفة تنزيل، ولا تُجمع إحصاءات، وتُتجاهل الحماية من الربط المباشر.\n"
      markdown-image: قالب صورة Markdown
      markdown-image_description: "يعرض الصورة كاملة داخل المنشور باستخدام Markdown. <strong>يجب أن تكون إضافة flarum/markdown مثبّتة ومفعّلة ليعمل هذا.</strong> لا وظيفة تنزيل، ولا تُجمع إحصاءات، وتُتجاهل الحماية من الربط المباشر.\n"
      bbcode-image: قالب صورة BBCode
      bbcode-image_description: "يعرض الصورة كاملة داخل المنشور باستخدام BBCode. <strong>يجب أن تكون إضافة flarum/bbcode مثبّتة ومفعّلة ليعمل هذا.</strong> لا وظيفة تنزيل، ولا تُجمع إحصاءات، وتُتجاهل الحماية من الربط المباشر.\n"
      just-url: الرابط فقط
      just-url_description: "يُدرج الرابط فقط. ويمكن أن تتولى إضافات أخرى معالجة عرضه عبر خاصية الربط التلقائي. لا وظيفة تنزيل، ولا تُجمع إحصاءات، وتُتجاهل الحماية من الربط المباشر.\n"
      text-preview: معاينة النص
      text-preview_description: "يُدرج معاينة (أول 5 أسطر) من الملف النصي، مع خيار للتوسيع وكشف محتوى الملف كاملًا.\n"
