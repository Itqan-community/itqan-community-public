    warnings:
      fileinfo_missing: "إضافة PHP <strong>fileinfo</strong> غير محمّلة على هذا الخادم. وسيظل FoF Upload يعمل، لكن التحقق المتقاطع من نوع MIME معطّل، ما يقلّل الحماية من أنواع الملفات المزوّرة. فعّل الإضافة في إعدادات PHP لأفضل أمان.\n"
      max_file_size_exceeds_php: يتجاوز هذا حد الرفع الفعلي على خادمك البالغ <strong>{limit}</strong> (<code>post_max_size={post}</code>، <code>upload_max_filesize={upload}</code>). وسيرفض PHP أي رفع أكبر من ذلك الحد بغض النظر عن هذا الإعداد. اخفض هذه القيمة أو ارفع الحدود في <code>php.ini</code> (و<code>client_max_body_size</code> إذا كنت تستخدم Nginx).
