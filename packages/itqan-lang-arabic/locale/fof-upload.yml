fof-upload:
  admin:
    nav:
      shared-uploads-button: المرفوعات المشتركة
    shared-uploads:
      description: ارفع ملفات يمكن لجميع مستخدمي منتداك استخدامها.
      introduction: "المرفوعات المشتركة هي ملفات يمكن لجميع مستخدمي منتداك استخدامها. وهي غير مرتبطة بأي منشور، لكن يمكن إدراجها في المنشورات عبر مدير الوسائط.\n\n<strong>تحذير:</strong> المرفوعات المشتركة غير محمية بأي أذونات. ويمكن لأي شخص يملك الرابط عرضها.\n"
      no-files: لم تُرفع أي ملفات مشتركة بعد.
      title: المرفوعات المشتركة
      upload-new-button: رفع ملف جديد
    pane:
      title: الرفع
      description: إعداد خدمات الرفع والتفضيلات.
    help_texts:
      disable-download-logging: "تعطيل تسجيل كل عملية تنزيل يقوم بها مستخدمو منتداك. وإبقاؤه مفعّلًا يتيح لك عرض عدد التنزيلات ومقاييس أخرى في المستقبل القريب.\n"
      disable-hotlink-protection: "تمنع الحماية من الربط المباشر (hotlink) فتح التنزيلات من مواقع أخرى. وتتطلب الطريقة الحالية رمز csrf ومعرّف المنشور.\n"
      download_templates: "قوالب التنزيل هي طريقة عرض المرفوعات في منتداك، مثل المعاينات والأزرار. والمتاح حاليًا:\n"
      mime_types: حدّد الملفات التي يمكن للأعضاء رفعها، وأين يُخزّن كل نوع، وكيف يظهر في المنشور.
      mime_order: "تُطابَق القواعد من الأعلى إلى الأسفل وتفوز أول مطابقة، لذا ضع القواعد الأكثر تحديدًا فوق القواعد العامة.\n"
      resize: اختر ما إذا كنت تريد تغيير حجم صورك قبل رفعها. ويمكنك اختيار حد أقصى للعرض والارتفاع بالبكسل. وتحافظ عملية تغيير الحجم على نسبة أبعاد الصور.
      client_extension: "يختار الرفع افتراضيًا امتداد ملف آمنًا بناءً على نوع MIME.\nوبالنسبة لبعض أنواع الملفات المعتمدة على ZIP أو البيانات الثنائية، قد يؤدي ذلك إلى استخدام امتدادات عامة بدلًا من الامتداد المتوقع.\nوهنا يمكنك إدخال قائمة مفصولة بفواصل من امتدادات الملفات التي ستُبقى كما هي.\n"
      thumbnails: "توليد صورة مصغّرة مُصغّر حجمها للصور عند الرفع. وتُعرض الصورة المصغّرة داخل المنشور،\nوالنقر عليها يفتح الملف الأصلي بالدقة الكاملة في تبويب جديد. وتقلّل الصور المصغّرة كثيرًا من\nاستهلاك النطاق الترددي وثقل الصفحة في المنتديات التي تحوي صورًا كبيرة كثيرة.\n"
      thumbnail_quality: "جودة الترميز من 1 إلى 100، وتُطبّق على الصور المصغّرة بصيغتي WebP و JPEG. والقيم الأعلى تبدو أكثر حدة\nلكنها تنتج ملفات أكبر. أما الصور المصغّرة GIF و PNG فهي بلا فقدان وتتجاهل هذا الإعداد.\nوتحتفظ الصور المصغّرة الحالية بجودتها حتى تُعاد توليدها بالأمر backfill.\n"
      watermark: "اختر ما إذا كانت الصور ستضاف إليها علامة مائية أثناء الرفع. وتُضاف العلامات المائية إلى الصور غير المتحركة (غير GIF) وفق تفضيلاتك أدناه.\n"
      storage_intro: "تُعرض هنا الخدمات التي أعددتها، أو التي يستخدمها نوع ملف ما. ويمكنك إعداد خدمة\nقبل ربط أي نوع ملف بها — عيّنها في تبويب الملفات عندما تكون جاهزًا.\n"
      storage_configure_another: "هناك خدمات تخزين أخرى مثبّتة لكنها غير معدّة بعد. وإعداد إحداها لا يغيّر مكان حفظ الملفات\nحتى تعيّنها لنوع ملف.\n"
      storage_not_installed: تبحث عن Amazon S3 أو Cloudflare R2 أو Qiniu؟ تحتاج هذه إلى حزمة إضافية — راجع <a>تثبيت محوّلات التخزين</a>.
      local_cdn: "اختياري. إذا كنت تقدّم <code>assets/files</code> عبر CDN، فأدخل عنوانه الأساسي وستستخدمه روابط الملفات المرفوعة.\nاتركه فارغًا لتقديم الملفات مباشرة من منتداك.\n"
      s3_provider: "اختيار المزوّد يحدّد تنسيق نقطة النهاية وأسلوب العنونة ودعم ACL أدناه. واختر «Other S3-compatible»\nإذا لم يكن مزوّدك مُدرجًا.\n"
      s3_endpoint: "رابط S3 API الخاص بالمزوّد — وليس الرابط العام للحاوية (bucket) الخاصة بك. ولا يحتاج Amazon S3 إليه.\n"
      s3_acl: "يُطبّق على كل كائن مرفوع. واتركه فارغًا للقيمة الافتراضية للمزوّد (عادةً خاصة).\nاستخدم <code>public-read</code> إذا وجب أن تكون الملفات قابلة للقراءة مباشرة من الحاوية.\n"
      s3_acl_unsupported: "{provider} لا يدعم ACL. وتحكّم في الوصول العام من لوحة تحكم المزوّد نفسه بدلًا من ذلك.\n"
      s3_path_style: "يضع الحاوية في مسار الرابط بدلًا من اسم المضيف. ويطلبه MinIO و Cloudflare R2؛\nويُضبط تلقائيًا عند اختيار مزوّد.\n"
      custom_s3_url: "الرابط الأساسي العام الذي تُقدَّم منه ملفاتك — CDN أو نطاق مخصص أمام الحاوية.\nاتركه فارغًا لاستخدام الرابط الافتراضي للمزوّد. ويجب أن يتضمن <code>https://</code>.\n"
      s3_instance_profile: "اترك الحقلين فارغين لاستخدام دور IAM بدلًا من ذلك — لا يعمل إلا على EC2 أو ECS أو EKS.\n"
      composer_buttons: افتراضيًا يظهر زر مدير الوسائط وزر الرفع معًا. ويمكنك أيضًا اختيار عرض زر واحد فقط.
