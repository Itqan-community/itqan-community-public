      body: |
        قام شخص ما (نأمل أن تكون أنت!) بالتسجيل في {forum} بهذا البريد الإلكتروني.

        إن كنت أنت، فاضغط على الرابط التالي وسيُفعَّل حسابك:
        {url}

        وإن لم تكن أنت من سجّل، فتجاهل هذه الرسالة.
