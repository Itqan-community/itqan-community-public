      body: |
        قام شخص ما (نأمل أن تكون أنت!) بتغيير بريده الإلكتروني في {forum} إلى هذا العنوان.

        إن كنت أنت، فاضغط على الرابط التالي ليُؤكَّد بريدك الجديد:
        {url}

        وإن لم تكن أنت، فتجاهل هذه الرسالة.
