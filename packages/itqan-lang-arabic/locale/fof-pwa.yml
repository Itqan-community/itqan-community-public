fof-pwa:
  admin:
    nav:
      pwa_button: تطبيق ويب تقدّمي
      pwa_text: إعداد Flarum ليعمل كتطبيق ويب تقدّمي، قابل للتثبيت على الأجهزة المحمولة.

    pwa:
      about:
        heading: حول
        description_label: الوصف
        description_text: يمكنك تعيين الوصف من صفحة «الأساسيات» في لوحة الإدارة.
        long_name_label: الاسم الطويل
        long_name_text: اسم تطبيق الويب المعروض للمستخدم.
        short_name_label: الاسم المختصر
        short_name_text: اسم التطبيق المعروض للمستخدم عندما لا تتوفر مساحة كافية للاسم الطويل.

      colors:
        heading: الألوان
        background_color_label: لون الخلفية
        background_color_text: يُستخدم لونًا نائبًا في شاشة البداية المعروضة أثناء تحميل تطبيق PWA، ولا يُستخدم بعد اكتمال تحميل التطبيق.
        theme_color_label: لون السمة
        theme_color_text: تستخدم الأجهزة هذا اللون أحيانًا عند عرض تطبيقك، مثل لون الإطار حول الموقع في مبدّل المهام على Android.

      maintenance:
        heading: الصيانة
        debug_label: تفعيل وضع التصحيح
        debug_text: سيسجّل هذا معلومات الإشعارات في `storage/logs`. يُستحسن إبقاؤه معطّلًا لتجنّب ملء السجلات دون داعٍ.
        reset_vapid_button: إعادة تعيين مفاتيح VAPID
        reset_vapid_text: سيؤدي هذا إلى إعادة توليد مفاتيح VAPID وحذف أي اشتراكات قائمة تستخدم المفاتيح الحالية.
        reset_vapid_confirm: ستؤدي إعادة تعيين مفاتيح VAPID إلى إزالة الاشتراكات التي تستخدم المفاتيح الحالية، فلن يتلقى المستخدمون أي إشعارات حتى زيارتهم موقعك في المرة القادمة. لا تفعل هذا إلا عند إعداد الإشعارات الفورية لأول مرة، أو إذا كانت الإشعارات الفورية لا تعمل إطلاقًا مع ظهور تحذير بفقدان مفاتيح VAPID أعلاه.
        reset_vapid_success: 'تمت إعادة تعيين مفاتيح VAPID بنجاح. أُعيد تعيين {count} اشتراك. أعد تحميل الصفحة لرؤية تقرير فحص الحالة المحدّث.'

      firebase_config:
        heading: Firebase
        help_text: 'لإضافة دعم الإشعارات الفورية عند نشر تطبيقك في App Store من Apple، عليك استخدام Firebase لإضافة الإشعارات الفورية إلى تطبيقك. يُرجى توليد Service Config الخاص بـ Firebase ورفعه هنا. <a>راجع التوثيق</a>.'
        upload_successful: تم رفع إعدادات Firebase بنجاح.
        upload_file: رفع ملف

      other:
        heading: أخرى
        display_label: وضع العرض
        display_text: "كيف يُفتح التطبيق عند تشغيله من أيقونته:\n\nمستقل: نافذة تطبيق منفصلة بلا شريط عنوان المتصفح.\nواجهة بسيطة: مثل الوضع المستقل، مع تنقّل أساسي كالرجوع وإعادة التحميل.\nملء الشاشة: يستخدم الشاشة كاملة بلا عناصر تحكم المتصفح.\nالمتصفح: يُفتح في تبويب أو نافذة متصفح عادية.\n\nقد تلجأ المتصفحات إلى بديل إذا لم يكن الوضع المحدد مدعومًا.\n"
        display_options:
          standalone: مستقل
          minimal_ui: واجهة بسيطة
          fullscreen: ملء الشاشة
          browser: المتصفح
        orientation_label: اتجاه الشاشة
        orientation_text: "أي: دع التطبيق يدور مع الجهاز.\nطبيعي: استخدم الاتجاه المعتاد للجهاز، عادةً عمودي على الهواتف وأفقي على الشاشات.\nعمودي: أبقِ التطبيق رأسيًا.\nأفقي: أبقِ التطبيق أفقيًا.\n\nيسمح كلٌّ من العمودي والأفقي بموضعين متعاكسين بزاوية 180 درجة. اختر خيارًا أساسيًا أو ثانويًا لاستخدام موضع واحد فقط. على الهاتف، يعني العمودي (أساسي) عادةً الوضع القائم، والعمودي (ثانوي) الوضع المقلوب. وفي الأفقي، يعتمد الاتجاه الأساسي على الجهاز.\n\nقد تتجاهل بعض المتصفحات والأجهزة الاتجاه المحدد.\n"
        orientation_options:
          any: أي
          natural: طبيعي
          portrait: عمودي
          portrait_primary: عمودي (أساسي)
          portrait_secondary: عمودي (ثانوي)
          landscape: أفقي
          landscape_primary: أفقي (أساسي)
          landscape_secondary: أفقي (ثانوي)
        push_notif_preference_default_to_email_label: تفعيل الإشعارات الفورية افتراضيًا مع البريد الإلكتروني
        push_notif_preference_default_to_email_text: عند التفعيل، ستكون الإشعارات الفورية مفعّلة افتراضيًا لكل أنواع الإشعارات التي يكون فيها البريد الإلكتروني مفعّلًا افتراضيًا. وعند التعطيل، ستكون الإشعارات الفورية معطّلة افتراضيًا.
        window_controls_overlay_label: تفعيل تراكب عناصر التحكم بالنافذة
        window_controls_overlay_text: "عند استخدامه في متصفح سطح مكتب مدعوم، يحل تراكب عناصر التحكم بالنافذة محل وضع العرض المحدد.\n\nعند التفعيل، يمكن للمستخدمين الحصول على تجربة أكثر انغماسًا وأقرب إلى التطبيقات الأصلية بإخفاء شريط العنوان الأصلي. ويعتمد تطبيق التراكب فعليًا على تفضيل المستخدم وتوافق المتصفح. عليك تخصيص شريط العنوان باستخدام CSS/JS بعد التفعيل، وإلا فسيتداخل التراكب مع عناصر شريط التنقل العلوي في منتداك ويصبح سحب النافذة شبه مستحيل، ما يؤدي إلى تجربة سيئة.\n\nانظر أيضًا: <compatibilitylink>توافق المتصفحات مع تراكب عناصر التحكم بالنافذة</compatibilitylink> و <learnlink>حول تراكب عناصر التحكم بالنافذة على Microsoft Learn</learnlink>\n"
        user_max_subscriptions_label: الحد الأقصى لاشتراكات الإشعارات الفورية لكل مستخدم
        user_max_subscriptions_text: كم عدد اشتراكات الإشعارات الفورية التي يمكن لكل مستخدم امتلاكها في الوقت نفسه؟ عند وصول إشعار فوري إلى المستخدم، يولّد كل اشتراك طلبًا إلى واجهة برمجية. ويمثّل كل اشتراك عادةً متصفحًا استخدمه المستخدم.
        push_notification_ttl_label: مدة صلاحية الإشعارات الفورية (TTL)
        push_notification_ttl_text: كم من الوقت (بالثواني) تبقى الإشعارات الفورية غير المسلّمة في قائمة انتظار خدمة الإرسال قبل انتهاء صلاحيتها.
        share_buttons_label: تفعيل أزرار المشاركة
        share_buttons_text: عند التفعيل، يُضاف زر «مشاركة» إلى المناقشات والمشاركات والأعضاء.

      heading: إعداد تطبيق الويب التقدّمي
      text: اضبط موقع Flarum ليعمل كتطبيق ويب تقدّمي! لاحظ أن هذا لا يضع موقعك في متجر التطبيقات تلقائيًا، بل يمنح المستخدمين خيار «إضافة إلى الشاشة الرئيسية». نوفّر بعض فحوصات الحالة، لكن أفضل طريقة للتجربة هي تثبيته بنفسك (ابحث في الويب عن تعليمات تثبيت تطبيقات الويب التقدّمية). تذكّر أن مطالبات «تثبيت هذا التطبيق» تتحكم بها المتصفحات ولا يمكن للمطورين أو المشرفين أو البرامج إطلاقها. فكّر في تضمين تعليمات تثبيت PWA في توثيق موقعك.
      status_check_heading: فحص الحالة
      logo_heading: الشعارات والأيقونات
      logo_text: "عليك رفع شعار واحد على الأقل ليكون تطبيق الويب التقدّمي قابلًا للتثبيت. لاحظ أن جميع الشعارات يجب أن تكون مربعة؛ وإن لم تكن، ستُغيّر أبعادها وقد تُمدّد.\n\nتتوفر عدة خيارات للأحجام أدناه. نوصي برفع شعار لأكبر عدد منها، لأن ذلك يدعم أجهزة أكثر.\n\nيمكنك رفع شعار كبير واحد في حقول الأحجام الأصغر. على سبيل المثال، يمكنك رفع شعار بحجم 1000x1000 بكسل في جميع حقول الملفات أدناه. لكن إذا رفعت شعارًا بحجم 50x50 بكسل في حقل 512x512، فسيُمدّد مدًّا كبيرًا.\n"
      logo_size_text: 'ارفع شعارًا ستُعدّل أبعاده إلى {size} × {size} بكسل.'
      submit_button: حفظ الإعدادات
      refreshed_message: تم تحديث إعدادات PWA بنجاح.

    status:
      config_no_https: الرابط في ملف config.php لا يستخدم HTTPS، وهو مطلوب لعمل تطبيقات الويب التقدّمية.
      possible_https_disabled: قد لا يعمل موقعك على HTTPS. قد يساعد مسح ذاكرة التخزين المؤقت (لوحة الإدارة => زر الأدوات). إن كان يعمل، تجاهل هذا. وإن لم يكن، تذكّر أن HTTPS مطلوب لعمل تطبيقات الويب التقدّمية.
      no_logo: عليك رفع شعار واحد على الأقل بحجم 144x144 بكسل على الأقل ليكون تطبيق PWA قابلًا للتثبيت.
      no_name: عليك توفير اسم كامل ليعمل تطبيقك.
      no_vapid_keys: لم يُعثر على مفاتيح VAPID، وهي مطلوبة لإرسال الإشعارات الفورية. يمكنك إعادة تعيينها أدناه.
      key_gen_failed: 'فشل توليد المفاتيح اللازمة للإشعارات الفورية. رسالة الخطأ الكاملة: {error}'
      suggest_gmp: يبدو أن إضافة gmp في PHP غير مفعّلة على خادمك. ليست ضرورية تمامًا، لكنها قد تحسّن الأداء ويُنصح بها. مع ذلك، قد لا تدعمها بعض الاستضافات المشتركة.
      success: لم يُعثر على أي مشكلات محتملة!

  forum:
    alerts:
      optin: يمكن لهذا المنتدى إرسال إشعارات فورية إلى هذا الجهاز. هل تريد تفعيلها؟
      optin_enable_button: تفعيل
      optin_success: تم تفعيل الإشعارات الفورية على هذا الجهاز.
      optin_declined: تم حظر الإشعارات الفورية. يمكنك السماح بها لاحقًا من إعدادات المتصفح.
      optin_deferred: لم تُفعّل الإشعارات الفورية. يمكنك تفعيلها لاحقًا من إعدادات الإشعارات.

    discussion_controls:
      share_button: مشاركة

    post_controls:
      share_button: مشاركة
      share_api:
        title: 'ردّ {username} على {title}'

    user_controls:
      share_button: مشاركة

    settings:
      push_header: الإشعارات الفورية
      pwa_notifications:
        access_default: بسبب قيود المتصفح، عليك الاشتراك بنفسك لتلقي الإشعارات الفورية على هذا الجهاز.
        access_default_button: اشتراك
        access_denied: عليك تعديل إعدادات المتصفح لتلقي الإشعارات الفورية على هذا الجهاز.
        access_denied_button: كيف تفعل ذلك
        no_browser_support: هذا المتصفح لا يدعم الإشعارات الفورية لتطبيقات الويب التقدّمية.
        no_browser_support_button: اعرف المزيد

    notifications_help:
      title: تفعيل الإشعارات الفورية
      description: إذا حظرت الإشعارات سابقًا، فاتبع التعليمات أدناه لإعادة تفعيلها على جهازك.
      browser_notifications_title: كيف تفعّل إشعارات المتصفح
      chromium_title: Google Chrome وMicrosoft Edge وAndroid
      chromium_instructions: انقر أيقونة معلومات الموقع (أيقونة القفل أو الضبط) بجوار عنوان الويب في متصفحك، ثم اختر «إعدادات الموقع» (أو «الأذونات»)، وابحث عن «الإشعارات»، وغيّر الإعداد إلى «السماح».
      firefox_title: Mozilla Firefox
      firefox_instructions: انقر أيقونة القفل بجوار عنوان الويب. إذا ظهرت «الإشعارات» بحالة «محظورة»، فانقر «X» بجوارها لإزالة القيد. أعد تحميل الصفحة واسمح بالإشعارات عند ظهور المطالبة.
      safari_mac_title: Apple Safari (macOS)
      safari_mac_instructions: افتح قائمة Safari أعلى الشاشة واختر «الإعدادات» (أو «التفضيلات»). انقر تبويب «المواقع»، واختر «الإشعارات» في الشريط الجانبي الأيسر، وابحث عن هذا المنتدى في القائمة، وغيّر الإعداد إلى «السماح».
      safari_ios_title: Apple iPhone وiPad (iOS/iPadOS)
      safari_ios_instructions: تتطلب الإشعارات الفورية على iOS تثبيت التطبيق. في Safari، انقر أيقونة «المشاركة» واختر «إضافة إلى الشاشة الرئيسية»، ثم افتح التطبيق المثبّت حديثًا. وإذا كانت الإشعارات محظورة، فافتح تطبيق «الإعدادات» في iOS، واذهب إلى «الإشعارات»، واختر تطبيق الويب هذا من القائمة، وفعّل «السماح بالإشعارات».

  api:
    keys_invalid: تعذّر تفعيل الإشعارات الفورية لأن متصفحك قدّم مفاتيح تشفير غير صالحة. يُرجى محاولة تفعيل الإشعارات مرة أخرى.
    endpoint_https_required: 'تعذّر تفعيل الإشعارات الفورية لأن متصفحك قدّم رابط خدمة إرسال غير صالح «{url}». يلزم رابط HTTPS صالح.'
    endpoint_host_not_allowed: 'تعذّر تفعيل الإشعارات الفورية لأن مضيف خدمة الإرسال «{host}» الذي يستخدمه متصفحك غير مسموح. يُرجى التواصل مع مشرف المنتدى.'

  views:
    offline:
      header: خطأ في اتصال الشبكة
      text: يتطلب هذا التطبيق اتصالًا بالشبكة ولا يعمل دون اتصال. يُرجى التحقق من اتصالك.
