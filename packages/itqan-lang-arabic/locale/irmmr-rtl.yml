irmmr-rtl:
  admin:
    settings:
      lang_base_label: اتجاه RTL حسب اللغة
      lang_base_text: عند التفعيل، يُطبَّق اتجاه RTL فقط إذا كانت لغة الواجهة الحالية تدعمه. وعند التعطيل، تُطبَّق إعدادات RTL للمنتدى ولوحة التحكم بلا شرط.
      rtl_languages_label: رموز لغات RTL
      rtl_languages_placeholder: fa, ar, he, ur
      rtl_languages_text: "قائمة رموز لغات مفصولة بفواصل تُعامَل كاتجاه من اليمين إلى اليسار عند تفعيل «اتجاه RTL حسب اللغة». مثال: fa, ar, he, ur\n"
      fm_status_label: اتجاه RTL في المنتدى
      fm_status_text: يفعّل تخطيط RTL لواجهة المنتدى. وإذا كان «اتجاه RTL حسب اللغة» مفعّلًا، فلن يُطبَّق إلا عندما تكون اللغة المختارة RTL.
      ad_status_label: اتجاه RTL في لوحة التحكم
      ad_status_text: يفعّل تخطيط RTL للوحة التحكم. وإذا كان «اتجاه RTL حسب اللغة» مفعّلًا، فلن يُطبَّق إلا عندما تكون اللغة المختارة RTL.
      driver_label: مشغّل CSS
      driver_options:
        rtlcss: مترجم CSS لاتجاه RTL
        custom: ملفات مخصّصة
      driver_text: "اختر كيفية التعامل مع أنماط RTL. سينشئ «rtlcss» نسخة RTL من CSS المُجمَّع تلقائيًا وفق قواعد تحويل RTL. أما «custom» فيعطّل الإنشاء التلقائي لـRTL لتتمكن من إدارة أنماط RTL يدويًا عبر قواعد الملفات أو عملية بناء مخصّصة. بعد تغيير هذا الإعداد، امسح ذاكرة Flarum المؤقتة لإعادة بناء الملفات.\n"
      minify_label: ضغط CSS المُجمَّع
      minify_text: "عند التفعيل، تُضغط ملفات CSS المُجمَّعة (بما فيها ناتج LESS → CSS وCSS المولَّد لـRTL) لتقليل حجم الملفات وتحسين الأداء. تحتاج هذه العملية إلى 512M من ذاكرة PHP على الأقل، وتجري مرة واحدة أثناء البناء فقط، لا مع كل طلب. بعد تغيير هذا الإعداد، امسح ذاكرة Flarum المؤقتة لإعادة إنشاء الملفات المُجمَّعة.\n"
      payloads:
        placeholder: مفتاح الحمولة، مثل fof-nightmode.assets.day
        section_title: تجاوزات الحمولات
        empty_text: لم تُضَف أي حمولات بعد
        add_button: إضافة حمولة
        help_text: "الحمولات هي ملفات CSS/JS تُحقَن في الصفحة عبر نظام الحمولات في واجهة Flarum. وعند إضافة حمولة هنا، تتحقق الإضافة مما إذا كانت تطابق ملف CSS أو JS، وتستبدله بنسخة مناسبة لـRTL وفق المشغّل المختار وقواعد ربط الملفات.\n"
      mappings:
        pattern_placeholder: النمط، مثل *.css
        replace_placeholder: البديل، مثل *.rtl.css
        type_options:
          auto: تلقائي
          css: CSS
          js: JS
        section_title: قواعد ربط الملفات
        empty_text: لم تُحدَّد أي قواعد ربط
        add_button: إضافة قاعدة
        help_text: "حدّد كيف تُربط ملفات CSS أو JS الأصلية بنسخها لـRTL. ويمكن أن تتضمن الأنماط محارف بديلة مثل \"*.css\". أمثلة:\n    bootstrap*.css  → bootstrap*.rtl.css\n    app.css         → app-rtl.css\nتُطبَّق هذه الروابط عند تحويل الحمولات أو عند إنشاء CSS لـRTL بمشغّل rtlcss. تذكّر مسح ذاكرة Flarum المؤقتة بعد إجراء التغييرات."
