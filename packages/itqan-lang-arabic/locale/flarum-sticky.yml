flarum-sticky:
  admin:
    settings:
      enable_display_excerpt: عرض مقتطف من المشاركة الأولى عندما يكون نقاش مثبّت غير مقروء
      only_sticky_unread_discussions_label: النقاشات المثبّتة غير المقروءة فقط
      only_sticky_unread_discussions_help: في صفحة كل النقاشات، تُثبّت النقاشات المثبّتة غير المقروءة في الأعلى، بينما تتبع النقاشات المثبّتة المقروءة الترتيب المعتاد.
      pin_sticky_on_all_discussions_label: تثبيت النقاشات المثبّتة في صفحة كل النقاشات
      pin_sticky_on_all_discussions_help: عند التفعيل (الافتراضي) تُثبّت النقاشات المثبّتة في أعلى صفحة كل النقاشات. وعند التعطيل تظهر في موضعها الطبيعي حسب آخر نشاط. أما صفحات الوسوم فتثبّت النقاشات المثبّتة في الأعلى دائمًا بغض النظر عن هذا الإعداد.

  lib:
