      alert_help: إشعار داخل المنتدى فقط. بلا بريد وبلا إشعارات دفع لهذا الوسم.
      mute_help: إيقاف إشعارات متابعة الوسوم لهذا الوسم. الإشارات المباشرة لا تُكتم.
      default_help: استخدم إعدادات متابعة الوسوم وإعدادات الإشعارات العامة.
      save_failed: تعذّر حفظ تفضيل الإشعار لهذا الوسم.
