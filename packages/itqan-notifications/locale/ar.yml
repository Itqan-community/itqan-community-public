itqan-notifications:
  api:
    invalid_channel: اختر البريد الفوري أو داخل المنتدى فقط أو كتم الإشعارات.
    channel_required: اختر تفضيل الإشعارات لهذا الوسم.

  forum:
    dnd:
      enable: تفعيل عدم الإزعاج
      disable: إيقاف عدم الإزعاج

    channel:
      email: بريد فوري
      alert: داخل المنتدى فقط
      mute: كتم
      default: السلوك الافتراضي للإشعارات

    modal:
      title: طريقة الإشعار
      help: هذه الخيارات تغيّر طريقة إشعارك عند متابعة الوسم، ولا تُضيفك إلى المتابعة ولا تلغيها.
      follow_to_choose: تابع الوسم أو راقبه بصمت لتختار طريقة إشعارك.
      email_help: إشعار داخل المنتدى وبريد إلكتروني. يُرسل البريد فقط إذا كان مفعّلاً في إعدادات إشعاراتك.
      alert_help: إشعار داخل المنتدى فقط. بلا بريد وبلا إشعارات دفع لهذا الوسم.
      mute_help: إيقاف إشعارات متابعة الوسوم لهذا الوسم. الإشارات المباشرة لا تُكتم.
      default_help: استخدم إعدادات متابعة الوسوم وإعدادات الإشعارات العامة.
      save_failed: تعذّر حفظ تفضيل الإشعار لهذا الوسم.

    notifications:
      discussion_replied_text: "رد {username} على نقاشك"
      comment_replied_text: "رد {username} على تعليقك"
    settings:
      notify_discussion_replied_label: يرد أحد على نقاش بدأته

  email:
    discussion_replied:
      subject: "[رد جديد] {title}"
      body: |
        مرحبًا {recipient_display_name}!

        رد {poster_display_name} على نقاشك: {title}.

        لمشاهدة الرد الجديد، اتبع الرابط:
        {url}

        ---

        {content}

        ---

    comment_replied:
      subject: "رد {replier_display_name} على تعليقك في {title}"
      body: |
        مرحبًا {recipient_display_name}!

        رد {replier_display_name} على تعليقك في {title}.

        {url}

        ---

        {content}

        ---
