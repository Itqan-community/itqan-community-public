itqan-notifications:
  forum:
    dnd:
      enable: Turn on Do Not Disturb
      disable: Turn off Do Not Disturb
    notifications:
      discussion_replied_text: "{username} replied to your discussion \"{title}\""
      comment_replied_text: "{username} replied to your comment in \"{title}\""
      post_approved_text: "Your post in \"{title}\" has been approved and published"
      discussion_stickied_text: "Congratulations! Your discussion \"{title}\" was pinned 📌"
      discussion_retagged_text: "Your discussion \"{title}\" was moved to {new_tag}"

  push:
    discussion_replied:
      title: "{username} replied to: {title}"
    comment_replied:
      title: "{username} replied to your comment"
    user_mentioned:
      title: "{username} mentioned you"
    post_mentioned:
      title: "{username} quoted your post"
    group_mentioned:
      title: "Mention for your group"
    new_post:
      title: "{username} in: {title}"
    new_discussion:
      title: "New discussion by {username}"
    post_liked:
      title: "{username} liked your post"
    post_reacted:
      title: "New Reaction {reaction}"
    badge_received:
      title: "New Badge Earned! 🏆"
    post_approved:
      title: "Post Approved ✅"
    discussion_stickied:
      title: "Discussion Pinned! 📌"
    discussion_retagged:
      title: "Category Updated 🏷️"

  email:
    discussion_replied:
      subject: "{poster_display_name} replied to your discussion: \"{title}\""
      body: |
        Hey {recipient_display_name}!

        {poster_display_name} replied to your discussion "{title}".

        To view the new reply, check out the following link:
        {url}

        ---

        {content}

        ---

    comment_replied:
      subject: "{replier_display_name} replied to your comment in: \"{title}\""
      body: |
        Hey {recipient_display_name}!

        {replier_display_name} replied to your comment in "{title}".

        {url}

        ---

        {content}

        ---

    post_approved:
      subject: "Your post in \"{title}\" has been approved"
      body: |
        Hey {recipient_display_name}!

        Great news! Your post in "{title}" has been reviewed and approved by our moderation team.

        To view your post:
        {url}

        ---

        {content}

        ---

    discussion_stickied:
      subject: "Congratulations! Your discussion \"{title}\" was pinned 📌"
      body: |
        Hey {recipient_display_name}!

        Congratulations! Our moderation team has pinned your discussion "{title}" to the top of the category.

        To view your pinned discussion:
        {url}

    discussion_retagged:
      subject: "Category update for your discussion: \"{title}\""
      body: |
        Hey {recipient_display_name}!

        Your discussion "{title}" has been moved under "{new_tag}" for better visibility.

        To view the discussion:
        {url}