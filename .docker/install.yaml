# Answers for `php flarum install`, so `docker compose up` lands on a forum you
# can log into rather than an installer form.
debug: true
baseUrl: http://localhost:8080
databaseConfiguration:
  # The stack runs MariaDB. Flarum 2.0 distinguishes the two: the `mysql`
  # driver emits MySQL-only JSON casts that MariaDB rejects with a 500 on the
  # first notification sync (e.g. replying to a followed tag).
  driver: mariadb
  host: db
  port: 3306
  database: flarum
  username: flarum
  password: flarum
  prefix: ''
adminUser:
  username: admin
  password: password123
  password_confirmation: password123
  email: admin@example.com
settings:
  forum_title: 'Itqan Community — local'
