; Flarum asks for 128M; the extension manager and asset compilation are
; happier with more headroom.
memory_limit = 256M

; Large enough for the screenshots and diagrams people post here.
upload_max_filesize = 20M
post_max_size = 24M

; A local environment should say what went wrong rather than hide it. The
; installer sets debug mode in config.php separately.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; PHP2Shell (CVE-2026-109618 / CVE-2026-109619) interim hardening.
; PHP parses multipart bodies before application code runs, and session upload
; progress records attacker-controlled field names into the session file. Both
; settings only reduce exposure: they are NOT the fix. The fix is a patched
; PHP. See docs/security/2026-10-21-php2shell.md.
session.upload_progress.enabled = Off
session.upload_progress.cleanup = On
session.use_strict_mode = 1
