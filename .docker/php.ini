; Flarum asks for 128M; the extension manager and asset compilation are
; happier with more headroom.
memory_limit = 256M

; Large enough for the screenshots and diagrams people post here.
upload_max_filesize = 20M
post_max_size = 24M

; Diagnostics go to the log, never into the response.
;
; `display_errors = On` is fatal for a web request. Composer requires every
; entry of vendor/composer/autoload_files.php at bootstrap, which includes
; thecodingmachine/safe's generated files; on PHP 8.4+ those emit a warning
; each ("resource"/"integer is not a supported builtin type"). With display on,
; that warning is written into the body before the first header, so
; SapiEmitter throws `EmitterException: Unable to emit response; headers already
; sent` and every request dies — on any URL, not just the one that tripped it.
;
; The CLI does not have this problem, which is why the entrypoint already
; passes `-d error_reporting=0`. Off here, with log_errors on, the same
; warnings still land in the Apache error log where they are actually readable.
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
