# EMERGENCY STOPGAP ONLY — PHP2Shell (CVE-2026-109618 / CVE-2026-109619).
#
# Rejects every multipart/form-data request in nginx before PHP parses the body.
# Include it inside each `server { ... }` block that passes requests to PHP:
#
#     include /etc/nginx/snippets/php2shell-block-multipart.conf;
#
# then: nginx -t && systemctl reload nginx
#
# What it costs: every file upload stops working — post images, avatars,
# banners, project files — and some forms that send multipart without a file.
# That is a real outage for this forum, so this is for a declared emergency
# window, not the default state.
#
# What it does not do: it covers only requests whose Content-Type nginx can see.
# PHP 8.4+ request_parse_body() parses multipart on methods nginx may not treat
# the same way, so a POST-only variant can be stepped around. It is a risk
# reduction, never a fix. Patch PHP and remove this include.
if ($http_content_type ~* "multipart/form-data") {
    return 403;
}
