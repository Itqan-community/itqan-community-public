name: Tests

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'feat/**'
  pull_request:
  workflow_dispatch:

jobs:
  php:
    name: Extension test suites
    runs-on: ubuntu-latest

    strategy:
      # Report every failure rather than stopping at the first.
      fail-fast: false
      matrix:
        # 8.1 is what production runs, so it has to be covered. 8.3 is what the
        # Dockerfile pins, so a developer and the container agree. 8.4 is
        # included because the dependency tree starts emitting
        # implicit-nullable deprecations there, and a change that only breaks on
        # a newer runtime should be caught before it reaches a deploy.
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # dom for the HTML to Markdown converter, mbstring and intl for text
          # handling, pdo_sqlite for the in-memory database the relation and
          # conditional-request tests use.
          extensions: dom, mbstring, intl, pdo_sqlite
          coverage: none

      # Deliberately no `composer install`.
      #
      # This repository tracks vendor/, and it is what production runs: the
      # deploy workflow does `git reset --hard origin/main` and never invokes
      # Composer. Testing the committed tree is therefore what tests what
      # actually ships.
      #
      # It also sidesteps composer.lock, which cannot list the local path
      # packages: adding one to composer.json invalidates the lock's
      # content-hash and a full resolve reaches the private flarum-lang-arabic
      # repository, which CI has no key for. A maintainer with access should run
      # `composer update --lock`, but until then an install here would fail on
      # "itqan/flarum-llms is not present in the lock file" and prove nothing
      # about the committed tree.
      - name: Confirm the committed vendor autoloads
        run: |
          php -r '
            require "vendor/autoload.php";
            foreach ([
              "Flarum\\Discussion\\Discussion",
              "Itqan\\Discussions\\Vote\\Vote",
              "Itqan\\Llms\\Controller\\LlmIndexController",
            ] as $class) {
              if (! class_exists($class)) {
                fwrite(STDERR, "missing from the committed autoloader: $class\n");
                exit(1);
              }
            }
            echo "committed vendor autoloads\n";
          '

      # The check the dev container also runs, on the tree CI actually gets:
      # every declared local path extension must be discoverable by Flarum.
      - name: Verify the local extensions are discoverable
        run: php .docker/verify-local-extensions.php

      - name: Run the itqan-llms suites
        run: php packages/itqan-llms/tests/run_all.php

      - name: Run the itqan-discussions migration test
        run: php packages/itqan-discussions/tests/vote_indexes_migration_test.php
