name: Deploy Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to staging.community.itqan.dev
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          BASIC_AUTH: ${{ secrets.STAGING_BASIC_AUTH }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/staging_deploy_key
          chmod 600 ~/.ssh/staging_deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Secrets cross the wire base64-encoded: ssh flattens trailing args
          # into one remote command string, so raw special characters (this
          # DB password contains &) get re-parsed by the remote shell.
          DB_PASSWORD_B64=$(printf '%s' "$DB_PASSWORD" | base64 | tr -d '\n')
          BASIC_AUTH_B64=$(printf '%s' "$BASIC_AUTH" | base64 | tr -d '\n')

          ssh -i ~/.ssh/staging_deploy_key "root@$SSH_HOST" bash -s -- "$DB_PASSWORD_B64" "$BASIC_AUTH_B64" <<'REMOTE'
          set -euo pipefail
          DB_PASSWORD=$(printf '%s' "$1" | base64 -d)
          BASIC_AUTH=$(printf '%s' "$2" | base64 -d)

          git config --global --add safe.directory /var/www/flarum

          # PHP2Shell gate. The session INI settings lower exposure but do not
          # fix CVE-2026-109618/109619; only a patched PHP does, and 8.1 is
          # end-of-life with no upstream patch. Existing checkouts run the gate
          # on the *incoming* tree (origin/staging) before the working copy is
          # replaced, so a vulnerable runtime fails the deploy without leaving
          # code ahead of the database. Documented emergency override:
          # PHP2SHELL_ALLOW_VULNERABLE=1.
          php2shell_gate() { # [git-ref]
            local ref=${1:-}
            local src_gate=scripts/security/php-version-gate.sh
            local src_versions=security/php2shell-fixed-versions.txt
            local gate=$src_gate versions=$src_versions
            local fpm_versions ver fpm_bin
            if [ -n "$ref" ]; then
              gate=/tmp/php2shell-gate.sh
              versions=/tmp/php2shell-fixed-versions.txt
              git show "$ref:$src_gate" > "$gate" || return 1
              git show "$ref:$src_versions" > "$versions" || return 1
            fi
            fpm_versions=$(grep -Rho 'unix:/run/php/php[0-9.]*-fpm.sock' /etc/nginx/sites-enabled/ 2>/dev/null \
              | sed -E 's#.*php([0-9.]+)-fpm\.sock#\1#' | sort -u)
            if [ -z "$fpm_versions" ]; then
              echo "No php-fpm socket in /etc/nginx/sites-enabled; refusing to guess the runtime"
              return 1
            fi
            for ver in $fpm_versions; do
              fpm_bin=$(command -v "php-fpm$ver" || true)
              if [ -z "$fpm_bin" ]; then
                echo "nginx points at php$ver-fpm but php-fpm$ver is not installed"
                return 1
              fi
              PHP2SHELL_FIXED_VERSIONS="$versions" bash "$gate" --fpm "$fpm_bin" || return 1
            done
          }

          # Flarum 2.0 requires PHP >= 8.3, and both PHP2Shell advisories need a
          # supported branch. Install 8.4 if absent and point nginx at it BEFORE
          # the gate inspects the running runtime.
          if ! command -v php8.4 >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq || true
            apt-get install -y -qq software-properties-common ca-certificates curl
            add-apt-repository -y ppa:ondrej/php
            apt-get update -qq
            apt-get install -y -qq php8.4-fpm php8.4-cli php8.4-mysql php8.4-gd \
              php8.4-curl php8.4-mbstring php8.4-xml php8.4-zip php8.4-intl
          fi
          update-alternatives --set php /usr/bin/php8.4 >/dev/null 2>&1 || true
          if [ -f /etc/nginx/sites-available/flarum.conf ]; then
            sed -i -E 's#php8\.[0-9]+-fpm\.sock#php8.4-fpm.sock#g' /etc/nginx/sites-available/flarum.conf
          fi
          systemctl enable --now php8.4-fpm

          if [ -d /var/www/flarum/.git ]; then
            cd /var/www/flarum
            git fetch origin staging
            php2shell_gate origin/staging
            git reset --hard origin/staging
          else
            git clone --branch staging https://github.com/Itqan-community/itqan-community-public.git /var/www/flarum
            cd /var/www/flarum
            php2shell_gate
          fi

          # Flarum 2.0 dependencies are no longer committed; install from the
          # lock before touching the database.
          if ! command -v composer >/dev/null 2>&1; then
            curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
          fi
          rm -rf /var/www/flarum/vendor
          composer install --no-dev --prefer-dist --no-interaction --no-progress \
            --working-dir=/var/www/flarum

          # Flarum 2.0 distinguishes MySQL from MariaDB; the wrong driver fails
          # at boot. Detect from the server itself.
          DB_FLAVOR=$(php8.4 -r '
            try {
              $p = new PDO("mysql:host=10.107.0.2;port=3306;dbname=flarum", "flarum", $argv[1]);
              $v = $p->query("SELECT VERSION()")->fetchColumn();
              echo stripos($v, "mariadb") !== false ? "mariadb" : "mysql";
            } catch (Throwable $e) { echo "mysql"; }
          ' "$DB_PASSWORD")

          cat > /var/www/flarum/config.php <<PHP
          <?php return array (
            'debug' => false,
            'queue' => array('driver' => 'database'),
            'database' => array(
              'driver' => '${DB_FLAVOR}',
              'database' => 'flarum',
              'prefix' => '',
              'prefix_indexes' => true,
              'host' => '10.107.0.2',
              'port' => 3306,
              'username' => 'flarum',
              'password' => '${DB_PASSWORD}',
              'charset' => 'utf8mb4',
              'collation' => 'utf8mb4_unicode_ci',
              'engine' => 'InnoDB',
              'strict' => false,
            ),
            'url' => 'https://staging.community.itqan.dev',
            'paths' => array('api' => 'api', 'admin' => 'admin'),
            'headers' => array('poweredByHeader' => false, 'referrerPolicy' => 'same-origin'),
            'filesystems' => array(
              'disks' => array(
                'flarum-assets' => array(
                  'driver' => 'local',
                  'root' => '/var/www/flarum/public/assets',
                ),
              ),
            ),
            'mail' => array('driver' => 'log'),
            'cookie' => array('name' => '__Host-flarum', 'samesite' => 'lax'),
          );
          PHP

          mkdir -p storage/formatter storage/cache storage/assets storage/sessions storage/views storage/logs
          rm -rf storage/cache storage/assets
          # Rebuild the locale catalogue from source: the Arabic language pack is
          # committed under vendor/flarum-locale/arabic. A stale compiled
          # catalogue would otherwise keep serving old (or missing) translations.
          rm -f storage/locale/catalogue.*
          find public/assets -maxdepth 1 -type f \( -name "*.js" -o -name "*.css" -o -name "*.map" -o -name "rev-manifest.json" \) -delete
          mkdir -p storage/cache storage/assets public/assets

          chown -R www-data:www-data /var/www/flarum

          sudo -u www-data php flarum migrate
          sudo -u www-data php flarum cache:clear
          # Flarum 2.0 code-splits lazy components into public/assets/js/**.
          # Without this the top-level forum.js is rebuilt but the chunks stay
          # from an older build (breaking dropdowns, composers, share, fonts).
          sudo -u www-data php flarum assets:publish
          # Fail the deploy if the generated config is not prod-shaped.
          bash /var/www/flarum/scripts/staging-env-check.sh /var/www/flarum/config.php

          # Staging uses the database queue driver for production parity, so a
          # worker must be running. Idempotent; warns if the unit is missing.
          # Restart (not just enable) because the worker caches settings in
          # memory: after a config change it would keep sending with the old
          # values until recycled.
          if systemctl cat flarum-queue.service >/dev/null 2>&1; then
            systemctl enable flarum-queue
            systemctl restart flarum-queue
          else
            echo "WARNING: flarum-queue.service not installed; queued jobs will not run"
          fi

          sed -i 's#root /var/www/flarum-placeholder;#root /var/www/flarum/public;#' /etc/nginx/sites-available/flarum.conf
          sed -i 's#index index.html;#index index.php;#' /etc/nginx/sites-available/flarum.conf

          # Normalize the /robots.txt and /og/ locations so they are handled
          # exactly once (idempotent; also repairs duplicates from earlier
          # deploys). Back up first, and restore if the config fails to test.
          cp /etc/nginx/sites-available/flarum.conf /tmp/flarum.conf.bak
          python3 scripts/normalize-nginx-locations.py /etc/nginx/sites-available/flarum.conf

          # Flarum 2.0 fonts and code-split chunks have stable filenames. Serving
          # them as immutable for a year left browsers on stale glyphs/chunks
          # after a deploy (broken icons, dead lazy components), so revalidate.
          sed -i 's/expires 1y;/expires off;/; s/add_header Cache-Control "public, immutable";/add_header Cache-Control "no-cache";/' /etc/nginx/sites-available/flarum.conf

          # Staging must never be indexed. fof-sitemap generates robots.txt and
          # allows crawling. Put the header at server level so the internal
          # redirect into the PHP location (location ~ \.php$) inherits it.
          if ! grep -qF 'itqan-staging-noindex' /etc/nginx/sites-available/flarum.conf; then
            sed -i 's|^\(    \)include /etc/nginx/snippets/security-headers.conf;|\1include /etc/nginx/snippets/security-headers.conf;\n\1add_header X-Robots-Tag "noindex, nofollow" always;  # itqan-staging-noindex|' /etc/nginx/sites-available/flarum.conf
          fi

          # HTTP Basic Auth: gate staging behind a password. The htpasswd line
          # comes from a repo secret (this repo is public).
          printf '%s\n' "$BASIC_AUTH" > /etc/nginx/.htpasswd
          chmod 640 /etc/nginx/.htpasswd
          chown root:www-data /etc/nginx/.htpasswd
          if grep -qF '#auth_basic "Restricted";' /etc/nginx/sites-available/flarum.conf; then
            sed -i 's|^\([[:space:]]*\)#auth_basic "Restricted";|\1auth_basic "Restricted";|; s|^\([[:space:]]*\)#auth_basic_user_file /etc/nginx/.htpasswd;|\1auth_basic_user_file /etc/nginx/.htpasswd;|' /etc/nginx/sites-available/flarum.conf
          fi
          # --- Staging throughput ------------------------------------------------
          # The staging origin is reached directly (no CDN in front of it), and
          # the path to it throttles per-connection throughput hard. Two cheap
          # fixes that stay inside nginx:
          #   1. nginx's default `gzip_types` is text/html only, so forum.js
          #      (1 MB), the CSS bundles and JSON were all sent uncompressed.
          #   2. HTTP/2 multiplexes everything over one TCP connection, which is
          #      exactly the shape this path throttles; the usual six parallel
          #      HTTP/1.1 connections measured ~4.5x faster.
          # Keep this staging-only: production sits behind Cloudflare, which
          # already compresses and speaks HTTP/2/3 to browsers.
          cp scripts/nginx/staging-compression.conf /etc/nginx/conf.d/zz-flarum-compression.conf
          if ! grep -qF 'itqan-staging-http1' /etc/nginx/sites-available/flarum.conf; then
            sed -i -E 's|^([[:space:]]*listen [0-9.:]+ ssl) http2;.*|\1;  # itqan-staging-http1|' /etc/nginx/sites-available/flarum.conf
          fi

          # Staging is reached directly, over a path that throttles per-connection
          # throughput. CUBIC collapses on that shape; BBR keeps the window open.
          # Reversible: removing the sysctl file and reloading returns to cubic.
          modprobe tcp_bbr 2>/dev/null || true
          if sysctl -n net.ipv4.tcp_available_congestion_control | grep -qw bbr; then
            printf 'net.core.default_qdisc=fq\nnet.ipv4.tcp_congestion_control=bbr\n' > /etc/sysctl.d/99-itqan-bbr.conf
            sysctl -w net.core.default_qdisc=fq >/dev/null
            sysctl -w net.ipv4.tcp_congestion_control=bbr >/dev/null
            echo "TCP congestion control: $(sysctl -n net.ipv4.tcp_congestion_control)"
          else
            echo "WARNING: tcp_bbr unavailable; staying on $(sysctl -n net.ipv4.tcp_congestion_control)"
          fi

          # Newsletter (itqan-mailerlite) loads its web fonts and one helper
          # script from MailerLite's CDNs. Without these the popup works but
          # loses its fonts and the phone-field mask.
          if ! grep -qF 'itqan-mailerlite-csp' /etc/nginx/snippets/security-headers.conf; then
            sed -i \
              -e "s|script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://groot.mailerlite.com;|script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://groot.mailerlite.com https://static.mailerlite.com;  # itqan-mailerlite-csp|" \
              -e "s|style-src 'self' 'unsafe-inline' https://assets.mlcdn.com https://fonts.googleapis.com;|style-src 'self' 'unsafe-inline' https://assets.mlcdn.com https://fonts.googleapis.com https://fonts.mailerlite.com;|" \
              -e "s|font-src 'self' data: https://assets.mlcdn.com https://fonts.gstatic.com;|font-src 'self' data: https://assets.mlcdn.com https://fonts.gstatic.com https://fonts.mailerlite.com;|" \
              /etc/nginx/snippets/security-headers.conf
          fi

          if ! nginx -t; then
            cp /tmp/flarum.conf.bak /etc/nginx/sites-available/flarum.conf
            echo "nginx config invalid after normalization; restored previous config"
            nginx -t
            exit 1
          fi
          rm -f /tmp/flarum.conf.bak
          systemctl reload nginx
          # Reload whichever PHP-FPM branches are actually running: the box can
          # carry more than one during the 8.1 -> 8.3 security upgrade, and a
          # hard-coded service name would silently skip the one serving traffic.
          reloaded=0
          for svc in $(systemctl list-units --type=service --state=running --no-legend 'php*-fpm.service' | awk '{print $1}'); do
            systemctl reload "$svc"
            echo "Reloaded $svc"
            reloaded=1
          done
          if [ "$reloaded" = 0 ]; then
            echo "No running php*-fpm service to reload"
            exit 1
          fi

          # Rendering dependency for itqan-preview-cards: headless Chromium.
          # The Arabic fonts are bundled with the extension. Idempotent; a
          # failure here only downgrades cards to the brand fallback, so it
          # must not fail the deploy.
          if ! command -v google-chrome >/dev/null 2>&1 && [ ! -x /usr/bin/google-chrome-stable ] && [ ! -x /usr/bin/chromium ]; then
            if DEBIAN_FRONTEND=noninteractive apt-get update -qq \
               && wget -q -O /tmp/google-chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb \
               && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq /tmp/google-chrome.deb; then
              echo "Installed headless Chromium: $(google-chrome --version 2>/dev/null)"
            else
              echo "WARNING: could not install Chromium; preview cards will serve the brand fallback"
            fi
            rm -f /tmp/google-chrome.deb
          fi

          bash scripts/check-flarum-assets.sh
          REMOTE

      - name: Health check
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
        run: |
          # 401 counts as healthy here: it proves nginx + php-fpm answered and
          # Basic Auth is enforced, without needing the password as a CI secret.
          for i in $(seq 1 10); do
            code=$(curl -k -s -o /dev/null -w "%{http_code}" "https://$SSH_HOST" --resolve staging.community.itqan.dev:443:"$SSH_HOST" || true)
            if [ "$code" = "200" ] || [ "$code" = "301" ] || [ "$code" = "302" ] || [ "$code" = "401" ]; then
              echo "Staging responded with $code"
              exit 0
            fi
            echo "Attempt $i: got $code, retrying..."
            sleep 6
          done
          echo "Staging did not respond as expected"
          exit 1
