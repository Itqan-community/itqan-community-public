name: Deploy Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to staging.community.itqan.dev
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          SMTP_USERNAME: ${{ secrets.STAGING_SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.STAGING_SMTP_PASSWORD }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/staging_deploy_key
          chmod 600 ~/.ssh/staging_deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Secrets cross the wire base64-encoded: ssh flattens trailing args
          # into one remote command string, so raw special characters (this
          # DB password contains &) get re-parsed by the remote shell.
          DB_PASSWORD_B64=$(printf '%s' "$DB_PASSWORD" | base64 | tr -d '\n')
          SMTP_USERNAME_B64=$(printf '%s' "$SMTP_USERNAME" | base64 | tr -d '\n')
          SMTP_PASSWORD_B64=$(printf '%s' "$SMTP_PASSWORD" | base64 | tr -d '\n')

          ssh -i ~/.ssh/staging_deploy_key "root@$SSH_HOST" bash -s -- "$DB_PASSWORD_B64" "$SMTP_USERNAME_B64" "$SMTP_PASSWORD_B64" <<'REMOTE'
          set -euo pipefail
          DB_PASSWORD=$(printf '%s' "$1" | base64 -d)
          SMTP_USERNAME=$(printf '%s' "$2" | base64 -d)
          SMTP_PASSWORD=$(printf '%s' "$3" | base64 -d)

          git config --global --add safe.directory /var/www/flarum

          if [ -d /var/www/flarum/.git ]; then
            cd /var/www/flarum
            git fetch origin staging
            git reset --hard origin/staging
          else
            git clone --branch staging https://github.com/Itqan-community/itqan-community-public.git /var/www/flarum
            cd /var/www/flarum
          fi

          cat > /var/www/flarum/config.php <<PHP
          <?php return array (
            'debug' => false,
            'queue' => array('driver' => 'sync'),
            'database' => array(
              'driver' => 'mysql',
              'database' => 'flarum',
              'prefix' => '',
              'prefix_indexes' => true,
              'host' => '10.107.0.2',
              'port' => 3306,
              'username' => 'flarum',
              'password' => '${DB_PASSWORD}',
              'charset' => 'utf8mb4',
              'collation' => 'utf8mb4_unicode_ci',
              'engine' => 'InnoDB',
              'strict' => false,
            ),
            'url' => 'https://staging.community.itqan.dev',
            'paths' => array('api' => 'api', 'admin' => 'admin'),
            'headers' => array('poweredByHeader' => false, 'referrerPolicy' => 'same-origin'),
            'mail' => array(
              'driver' => 'smtp',
              'host' => 'in-v3.mailjet.com',
              'port' => 587,
              'username' => '${SMTP_USERNAME}',
              'password' => '${SMTP_PASSWORD}',
              'encryption' => 'tls',
              'from' => array('address' => 'noreply@itqan.dev', 'name' => 'Itqan Community Staging'),
            ),
            'cookie' => array('name' => '__Host-flarum', 'samesite' => 'lax'),
          );
          PHP

          mkdir -p storage/formatter storage/cache storage/assets storage/sessions storage/views storage/logs
          rm -rf storage/cache storage/assets
          # Rebuild the locale catalogue from source: the Arabic language pack is
          # committed under vendor/flarum-locale/arabic. A stale compiled
          # catalogue would otherwise keep serving old (or missing) translations.
          rm -f storage/locale/catalogue.*
          find public/assets -maxdepth 1 -type f \( -name "*.js" -o -name "*.css" -o -name "*.map" -o -name "rev-manifest.json" \) -delete
          mkdir -p storage/cache storage/assets public/assets

          chown -R www-data:www-data /var/www/flarum

          sudo -u www-data php flarum migrate
          sudo -u www-data php flarum cache:clear

          sed -i 's#root /var/www/flarum-placeholder;#root /var/www/flarum/public;#' /etc/nginx/sites-available/flarum.conf
          sed -i 's#index index.html;#index index.php;#' /etc/nginx/sites-available/flarum.conf

          # Flarum must serve /robots.txt (v17 SEO route) and the generated OG
          # card images at /og/*.png. The site conf denies *.txt and serves
          # *.png as static-only, so add an exact and a prefixed location that
          # fall through to index.php (idempotent).
          if ! grep -qF 'location ^~ /og/' /etc/nginx/sites-available/flarum.conf; then
            printf '%s\n' \
              '    location = /robots.txt {' \
              '        try_files $uri /index.php?$query_string;' \
              '    }' \
              '' \
              '    location ^~ /og/ {' \
              '        try_files $uri /index.php?$query_string;' \
              '    }' \
              > /tmp/itqan-flarum-locations.conf
            awk '{ if ($0 ~ /^[[:space:]]*location \/ \{/ && !done) { while ((getline line < "/tmp/itqan-flarum-locations.conf") > 0) print line; close("/tmp/itqan-flarum-locations.conf"); done=1 } print }' /etc/nginx/sites-available/flarum.conf > /tmp/itqan-flarum.conf.new
            mv /tmp/itqan-flarum.conf.new /etc/nginx/sites-available/flarum.conf
            rm -f /tmp/itqan-flarum-locations.conf
          fi

          nginx -t
          systemctl reload nginx
          systemctl reload php8.1-fpm

          echo "=== LOCALE DIAG ==="
          echo -n "disk core.yml has new tafqeet? "; grep -c 'لا تعليقات غير مقروءة' vendor/flarum-locale/arabic/locale/core.yml || true
          rm -f storage/locale/catalogue.*
          curl -sk -o /dev/null --resolve staging.community.itqan.dev:443:127.0.0.1 https://staging.community.itqan.dev/ || true
          echo -n "catalogue unread_text: "; grep -a -o "post_scrubber.unread_text' => '[^']*'" storage/locale/catalogue.ar.*.php 2>/dev/null | head -1 || echo none

          # Rendering dependency for itqan-preview-cards: headless Chromium.
          # The Arabic fonts are bundled with the extension. Idempotent; a
          # failure here only downgrades cards to the brand fallback, so it
          # must not fail the deploy.
          if ! command -v google-chrome >/dev/null 2>&1 && [ ! -x /usr/bin/google-chrome-stable ] && [ ! -x /usr/bin/chromium ]; then
            if DEBIAN_FRONTEND=noninteractive apt-get update -qq \
               && wget -q -O /tmp/google-chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb \
               && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq /tmp/google-chrome.deb; then
              echo "Installed headless Chromium: $(google-chrome --version 2>/dev/null)"
            else
              echo "WARNING: could not install Chromium; preview cards will serve the brand fallback"
            fi
            rm -f /tmp/google-chrome.deb
          fi

          bash scripts/check-flarum-assets.sh
          REMOTE

      - name: Health check
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
        run: |
          # 401 counts as healthy here: it proves nginx + php-fpm answered and
          # Basic Auth is enforced, without needing the password as a CI secret.
          for i in $(seq 1 10); do
            code=$(curl -k -s -o /dev/null -w "%{http_code}" "https://$SSH_HOST" --resolve staging.community.itqan.dev:443:"$SSH_HOST" || true)
            if [ "$code" = "200" ] || [ "$code" = "301" ] || [ "$code" = "302" ] || [ "$code" = "401" ]; then
              echo "Staging responded with $code"
              exit 0
            fi
            echo "Attempt $i: got $code, retrying..."
            sleep 6
          done
          echo "Staging did not respond as expected"
          exit 1
