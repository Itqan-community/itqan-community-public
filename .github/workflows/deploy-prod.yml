name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy main to community.itqan.dev
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.BETA_SSH_KEY }}
          SSH_HOST: ${{ secrets.BETA_SSH_HOST }}
          DB_PASSWORD: ${{ secrets.BETA_DB_PASSWORD }}
          SMTP_USERNAME: ${{ secrets.BETA_SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.BETA_SMTP_PASSWORD }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/beta_deploy_key
          chmod 600 ~/.ssh/beta_deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          DB_PASSWORD_B64=$(printf '%s' "$DB_PASSWORD" | base64 | tr -d '\n')
          SMTP_USERNAME_B64=$(printf '%s' "$SMTP_USERNAME" | base64 | tr -d '\n')
          SMTP_PASSWORD_B64=$(printf '%s' "$SMTP_PASSWORD" | base64 | tr -d '\n')

          ssh -i ~/.ssh/beta_deploy_key "root@$SSH_HOST" bash -s -- "$DB_PASSWORD_B64" "$SMTP_USERNAME_B64" "$SMTP_PASSWORD_B64" <<'REMOTE'
          set -euo pipefail
          DB_PASSWORD=$(printf '%s' "$1" | base64 -d)
          SMTP_USERNAME=$(printf '%s' "$2" | base64 -d)
          SMTP_PASSWORD=$(printf '%s' "$3" | base64 -d)

          git config --global --add safe.directory /var/www/flarum

          # Production DB. Backed up before every migration for easy rollback.
          mkdir -p /root/beta-db-backups
          BACKUP_FILE="/root/beta-db-backups/flarum-$(date +%Y%m%d-%H%M%S).sql.gz"
          mysqldump -h 10.106.0.5 -u flarum -p"$DB_PASSWORD" flarum | gzip > "$BACKUP_FILE"
          echo "DB backup written to $BACKUP_FILE ($(du -h "$BACKUP_FILE" | cut -f1))"

          cd /var/www/flarum
          if [ ! -d .git ]; then
            git init
            git remote add origin https://github.com/Itqan-community/itqan-community-public.git
          fi
          git fetch origin main
          git checkout -f main 2>/dev/null || git checkout -B main origin/main
          git reset --hard origin/main

          # Maintenance mode survives deploys: scripts/maintenance-mode.sh keeps a flag
          # file in storage/ (git reset does not touch it), and config.php is rebuilt below.
          MAINT=0
          OFFLINE_LINE=""
          if [ -e storage/maintenance ]; then
            MAINT=1
            OFFLINE_LINE="'offline' => true,"
            echo "Maintenance mode is on: keeping it on"
          fi

          cat > /var/www/flarum/config.php <<PHP
          <?php return array (
            'debug' => false,
            ${OFFLINE_LINE}
            'database' => array(
              'driver' => 'mysql',
              'database' => 'flarum',
              'prefix' => '',
              'prefix_indexes' => true,
              'host' => '10.106.0.5',
              'port' => 3306,
              'username' => 'flarum',
              'password' => '${DB_PASSWORD}',
              'charset' => 'utf8mb4',
              'collation' => 'utf8mb4_unicode_ci',
              'engine' => 'InnoDB',
              'strict' => false,
            ),
            'url' => 'https://community.itqan.dev',
            'paths' => array('api' => 'api', 'admin' => 'admin'),
            'headers' => array('poweredByHeader' => false, 'referrerPolicy' => 'same-origin'),
            'mail' => array(
              'driver' => 'smtp',
              'host' => 'in-v3.mailjet.com',
              'port' => 587,
              'username' => '${SMTP_USERNAME}',
              'password' => '${SMTP_PASSWORD}',
              'encryption' => 'tls',
              'from' => array('address' => 'noreply@itqan.dev', 'name' => 'Itqan Community'),
            ),
            'filesystems' => array(
              'disks' => array(
                'flarum-assets' => array(
                  'driver' => 's3',
                  'key' => 'SPACES_KEY_PLACEHOLDER',
                  'secret' => 'SPACES_SECRET_PLACEHOLDER',
                  'region' => 'SPACES_REGION_PLACEHOLDER',
                  'bucket' => 'SPACES_NAME_PLACEHOLDER',
                  'endpoint' => 'SPACES_ENDPOINT_PLACEHOLDER',
                  'use_path_style_endpoint' => false,
                  'url' => 'SPACES_CDN_ENDPOINT_PLACEHOLDER',
                ),
              ),
            ),
            'queue' => array('driver' => 'database'),
            'cookie' => array('name' => '__Host-flarum', 'samesite' => 'lax'),
          );
          PHP

          mkdir -p storage/formatter storage/cache storage/assets storage/sessions storage/views storage/logs
          rm -rf storage/cache storage/assets
          # Rebuild the locale catalogue from source: the Arabic language pack is
          # committed under vendor/flarum-locale/arabic. A stale compiled
          # catalogue would otherwise keep serving old (or missing) translations.
          rm -f storage/locale/catalogue.*
          find public/assets -maxdepth 1 -type f \( -name "*.js" -o -name "*.css" -o -name "*.map" -o -name "rev-manifest.json" \) -delete
          mkdir -p storage/cache storage/assets public/assets

          chown -R www-data:www-data /var/www/flarum

          sudo -u www-data php flarum migrate
          sudo -u www-data php flarum cache:clear

          # Flarum must serve /robots.txt (v17 SEO route) and the generated OG
          # card images at /og/*.png. The site conf denies *.txt and serves
          # *.png as static-only, so add an exact and a prefixed location that
          # fall through to index.php (idempotent).
          if ! grep -qF 'location ^~ /og/' /etc/nginx/sites-available/flarum.conf; then
            printf '%s\n' \
              '    location = /robots.txt {' \
              '        try_files $uri /index.php?$query_string;' \
              '    }' \
              '' \
              '    location ^~ /og/ {' \
              '        try_files $uri /index.php?$query_string;' \
              '    }' \
              > /tmp/itqan-flarum-locations.conf
            awk '{ if ($0 ~ /^[[:space:]]*location \/ \{/ && !done) { while ((getline line < "/tmp/itqan-flarum-locations.conf") > 0) print line; close("/tmp/itqan-flarum-locations.conf"); done=1 } print }' /etc/nginx/sites-available/flarum.conf > /tmp/itqan-flarum.conf.new
            mv /tmp/itqan-flarum.conf.new /etc/nginx/sites-available/flarum.conf
            rm -f /tmp/itqan-flarum-locations.conf
          fi

          nginx -t
          systemctl reload nginx
          systemctl reload php8.1-fpm

          # Rendering dependency for itqan-preview-cards: headless Chromium.
          # The Arabic fonts are bundled with the extension. Idempotent; a
          # failure here only downgrades cards to the brand fallback, so it
          # must not fail the deploy.
          if ! command -v google-chrome >/dev/null 2>&1 && [ ! -x /usr/bin/google-chrome-stable ] && [ ! -x /usr/bin/chromium ]; then
            if DEBIAN_FRONTEND=noninteractive apt-get update -qq \
               && wget -q -O /tmp/google-chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb \
               && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq /tmp/google-chrome.deb; then
              echo "Installed headless Chromium: $(google-chrome --version 2>/dev/null)"
            else
              echo "WARNING: could not install Chromium; preview cards will serve the brand fallback"
            fi
            rm -f /tmp/google-chrome.deb
          fi

          bash scripts/check-flarum-assets.sh

          # Origin check from the box itself: keeps working when 80/443 only accept
          # Cloudflare, and cannot be masked by an edge cache hit. Retries because a
          # request right after the reload can race it.
          for i in $(seq 1 10); do
            code=$(curl -sk -m 10 -o /dev/null -w "%{http_code}" -H "Host: community.itqan.dev" https://127.0.0.1/ || true)
            if [ "$code" = "200" ] || [ "$code" = "301" ] || [ "$code" = "302" ] || { [ "$MAINT" = 1 ] && [ "$code" = "503" ]; }; then
              echo "Origin responded with $code"
              break
            fi
            echo "Origin attempt $i: got $code, retrying..."
            [ "$i" = 10 ] && { echo "Origin did not respond as expected"; exit 1; }
            sleep 3
          done
          REMOTE

      - name: Read maintenance flag
        id: maint
        env:
          SSH_HOST: ${{ secrets.BETA_SSH_HOST }}
        run: |
          set +e
          ssh -i ~/.ssh/beta_deploy_key "root@$SSH_HOST" test -e /var/www/flarum/storage/maintenance
          case $? in
            0) echo "on=1" >> "$GITHUB_OUTPUT" ;;
            1) echo "on=0" >> "$GITHUB_OUTPUT" ;;
            *) echo "Could not read the maintenance flag over SSH"; exit 1 ;;
          esac

      - name: Health check (public, via Cloudflare)
        env:
          MAINT: ${{ steps.maint.outputs.on }}
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -m 15 -o /dev/null -w "%{http_code}" "https://community.itqan.dev" || true)
            if [ "$code" = "200" ] || [ "$code" = "301" ] || [ "$code" = "302" ] || { [ "$MAINT" = 1 ] && [ "$code" = "503" ]; }; then
              echo "Production responded with $code"
              exit 0
            fi
            echo "Attempt $i: got $code, retrying..."
            sleep 6
          done
          echo "Production did not respond as expected"
          exit 1
