      title: حفظ كمسودة
      saving: جاري الحفظ...
      saved: تم الحفظ!
      exit_alert: تجاهل التعديلات على المسودة
      discard_empty_draft_alert: المسودة فارغة، هل تود تجاهل حفظها
    dropdown:
      empty_text: لا يوجد بيانات
      title: المسودات
      delete_all_button: حذف كل المسودات
      delete_button: حذف المسودة
      schedule_button: => fof-drafts.ref.schedule_draft
      scheduled_icon_tooltip: جدولة إلى {datetime}
      # String passed to dayjs.format() to generate the tooltip date-time
      scheduled_icon_tooltip_formatter: L [at] LT
      tooltip: => fof-drafts.forum.dropdown.title
      alert: متأكد أنك تريد حذف المسودة؟
      delete_all_alert: متأكد أنك تريد حذف كل المسودات؟
    schedule_draft_modal:
      title: => fof-drafts.ref.schedule_draft
      text: جدولة المسودة للنشر تلقائيا في وقت لاحق
      scheduled_text: سيتم نشر المسودة في {datetime}.
      scheduled_error: "لا يمكن جدولة المسودة بسبب: {error}."
      unschedule_button: إلغاء الجدولة
      unschedule_warning: متأكد أنك تريد إلغاء الجدولة؟
      reschedule_button: إعادة جدولة
