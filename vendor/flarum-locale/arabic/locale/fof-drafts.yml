      # String passed to dayjs.format() to generate the preview
      schedule_time_preview_formatter: LLLL
      schedule_time_preview_invalid: خطأ في الوقت أو التاريخ
    user:
      settings:
        drafts_heading: المسودات
        draft_autosave_enable: الحفظ التلقائي للمسودات
        draft_autosave_interval_label: حفظ المسودات كل (بالثواني)
        draft_autosave_interval_button: تعديل الفاصل الزمني
        draft_autosave_interval_invalid: يجب أن يكون الفاصل الزمني أكبر من 4

