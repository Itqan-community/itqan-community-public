      post_link: "مشاركة رقم {number} في {discussion}"
      submit_button: => core.ref.save_changes
      view_button: => core.ref.view

    # These translations are used by the composer when replying to a discussion.
    composer_reply:
      body_placeholder: => core.ref.write_a_reply
      discard_confirmation: "لم تقم بنشر ردك بعد. هل ترغب في تجاهله؟"
      posted_message: تم نشر ردك.
      submit_button: نشر الرد
      view_button: => core.ref.view

    # These translations are used by the discussion control buttons.
    discussion_controls:
      cannot_reply_button: لا يمكنك الرد
      cannot_reply_text: ليس لديك صلاحية الرد على هذا الموضوع
      delete_button: حذف
      delete_confirmation: "هل أنت متأكد أنك تريد حذف هذا الموضوع"
      delete_forever_button: حذف نهائي
      log_in_to_reply_button: سجل الدخول للرد
      rename_button: إعادة تسمية
      reply_button: رد
      restore_button: استعادة
      toggle_dropdown_accessible_label: إظهار قائمة إجراءات الموضوع

    # These translations are used in the discussion list.
    discussion_list:
