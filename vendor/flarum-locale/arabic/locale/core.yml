    search:
      all_discussions_button: 'ابحث عن "{query}"'
      discussions_heading: => core.ref.discussions
      users_heading: => core.ref.users
      title: بحث
      no_results_text: لا توجد نتائج
      no_search_text: أدخل كلمة للبحث عنها
      options_heading: خيارات البحث
      placeholder: بحث...
      preview_heading: بحث
      search_clear_button_accessible_label: إعادة تعيين

    # These translations are used by search sources.
    search_source:
      discussions:
        all_button: 'عرض جميع المواضيع عن "{query}"'
        heading: => core.ref.discussions
      posts:
        all_button: 'عرض جميع التعليقات عن "{query}"'
        heading: => core.ref.posts
      users:
        heading: => core.ref.users

    # These translations are used in the Change Email modal dialog.
    change_email:
      confirm_password_placeholder: => core.ref.confirm_password
      confirmation_message: => core.ref.confirmation_email_sent
      dismiss_button: => core.ref.okay
      incorrect_password_message: كلمة المرور غير صحيحة.
      submit_button: => core.ref.save_changes
      title: => core.ref.change_email

    # These translations are used in the Change Password modal dialog.
    change_password:
      send_button: إرسال بريد إعادة تعيين كلمة المرور
      text: أضغط على زر إعادة تعيين كلمة المرور وستصلك تعليمات إعادة تعيين كلمة المرور إلى بريدك الإلكتروني.
      title: => core.ref.change_password

    # These translations are used by the composer controls.
    composer:
      close_tooltip: إغلاق
      exit_full_screen_tooltip: إنهاء وضع ملء الشاشة
      full_screen_tooltip: ملء الشاشة
      minimize_tooltip: تصغير
      preview_tooltip: معاينة

    # These translations are used by the composer when starting a discussion.
    composer_discussion:
