      remember_me_label: => core.ref.remember_me_label
      sign_up_text: "لا تملك حساباً؟ <a>سجل الآن</a>"
      submit_button: => core.ref.log_in
      title: => core.ref.log_in
      username_or_email_placeholder: => core.ref.username_or_email_placeholder

    # These translations are used by the Notifications dropdown, a.k.a. "the bell".
    notifications:
      delete_all_confirm: "هل أنت متأكد من حذف جميع الإشعارات؟ لا يمكن التراجع عن هذا الإجراء"
      delete_all_tooltip: حذف جميع الإشعارات
      discussion_renamed_text: "{username} قام بتغيير العنوان"
      empty_text: لا توجد إشعارات
      mark_all_as_read_tooltip: تعليم الكل كمقروء
      mark_as_read_tooltip: تعليم كمقروء
      title: الإشعارات
      toggle_dropdown_accessible_label: عرض الإشعارات
      tooltip: الإشعارات

    # These translations are used by tooltips displayed for individual posts.
    post:
      edited_text: تم التعديل
      edited_tooltip: "{username} قام بالتعديل منذ {ago}"
      number_tooltip: "مشاركة #{number}"

    # These translations are used by the post control buttons.
    post_controls:
      delete_button: حذف
      delete_confirmation: "هل أنت متأكد من حذف هذه المشاركة نهائياً؟ لا يمكن التراجع عن هذا الإجراء."
      delete_forever_button: حذف نهائي
      edit_button: تعديل
      hide_confirmation: "هل أنت متأكد من حذف هذه المشاركة؟"
      restore_button: استعادة
      toggle_dropdown_accessible_label: عرض قائمة التحكم بالمشاركة

    # These translations are used in the post list.
    post_scrubber:
      now_link: الأحدث
      original_post_link: الموضوع
      unread_text: "{count} غير مقروءة"
      viewing_text: "{count, plural, one {{index} من {formattedCount} تعليق} other {{index} من {formattedCount} تعليقات}}"

    # These translations are displayed between posts in the post stream.
    post_stream:
      discussion_renamed_old_tooltip: 'العنوان القديم كان: "{old}"'
      discussion_renamed_text: "{username} غير العنوان إلى {new} {time}"
      load_more_button: => core.ref.load_more
      reply_placeholder: اكتب رداً...
      time_lapsed_text: "بعد {period}"

    # These translations are used by the sorting control above the post list.
    posts_sort:
      newest_button: => core.ref.newest
      oldest_button: => core.ref.oldest
      relevance_button: => core.ref.relevance

