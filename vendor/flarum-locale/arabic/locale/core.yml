      not_found_message: لا يوجد مستخدم مسجل بهذا البريد الإلكتروني.
      submit_button: استعادة كلمة المرور
      text: أدخل بريدك الإلكتروني وسنرسل لك رابط إعادة تعيين كلمة المرور.
      title: نسيت كلمة المرور

    # These translations are used in the header and session dropdown menu.
    header:
      admin_button: لوحة الإدارة
      back_to_index_tooltip: العودة لقائمة المواضيع
      locale_dropdown_accessible_label: تغيير لغة المجتمع
      log_in_link: تسجيل الدخول
      log_out_button: تسجيل الخروج
      profile_button: الملف الشخصي
      search_placeholder: بحث في المجتمع
      search_role_label: بحث في المجتمع
      session_dropdown_accessible_label: إظهار خيارات الجلسة
      settings_button: الإعدادات
      sign_up_link: تسجيل جديد

    # These translations are used on the index page, peripheral to the discussion list.
    index:
      all_discussions_link: => core.ref.all_discussions
      cannot_start_discussion_button: لا يمكنك بدء موضوع
      mark_all_as_read_confirmation: "متأكد أنك تريد تحديد على كل المواضيع كمقروءة؟"
      mark_all_as_read_tooltip: => core.ref.mark_all_as_read
      meta_title_text: => core.ref.all_discussions
      refresh_tooltip: => core.ref.refresh
      start_discussion_button: => core.ref.start_a_discussion
      toggle_sidenav_dropdown_accessible_label: عرض قائمة التنقل


    # These translations are used by the sorting control above the discussion list.
    index_sort:
      latest_button: آخر تفاعل
      newest_button: => core.ref.newest
      oldest_button: => core.ref.oldest
      relevance_button: => core.ref.relevance
      toggle_dropdown_accessible_label: تغير ترتيب المواضيع
      top_button: الأفضل

    # These translations are used in the Log In modal dialog.
    log_in:
      forgot_password_link: "نسيت كلمة المرور؟"
