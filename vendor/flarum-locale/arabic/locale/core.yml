      discard_confirmation: "لم تقم بنشر الموضوع بعد. هل ترغب في تحاهله؟"
      submit_button: نشر الموضوع
      title: => core.ref.start_a_discussion
      title_placeholder: عنوان الموضوع

    # These translations are used by the composer when editing a post.
