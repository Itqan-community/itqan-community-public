      title: إعادة تسمية الموضوع

    # These translations are used in the Security page.
    security:
      browser_on_operating_system: "{browser} على {os}"
      cannot_terminate_current_session: لا يمكن إنهاء الجلسة الحالية. قم بتسجيل الخروج بدلاً من ذلك.
