      load_more_button: تحميل المزيد
      replied_text: "{username} قام بالرد منذ {ago}"
      skip_discussion_list_pane: تخطي قائمة المواضيع
      started_text: "{username} بدأ الموضوع منذ {ago}"
      total_replies_a11y_label: "{count, plural, one {# رد} other {# ردود}}"
      unread_replies_a11y_label: "{count, plural, one {# رد غير مقروء} other {# ردود غير مقروءة}}. تعليم {count, plural, one {reply} other {replies}} كـ مقروءة."

