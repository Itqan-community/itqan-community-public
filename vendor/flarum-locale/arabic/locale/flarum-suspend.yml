flarum-suspend:

  ##
  # UNIQUE KEYS - The following keys are used in only one location each.
  ##

  # Translations in this namespace are used by the forum user interface.
  forum:
    # These translations are used in the suspension notifications
    notifications:
      user_suspended_text: "تم إيقاف حسابك حتى {timeReadable}"
      user_suspended_indefinite_text: تم إيقاف حسابك
      user_unsuspended_text: تم تفعيل الحساب

    # These translations are used for the suspension reason informational modal to the suspended user.
    suspension_info:
      dismiss_button: إغلاق
      indefinite: الحساب موقوف نهائيا
      limited: "الحساب موقوف حتى {date}"
      title: الحساب موقوف

    # These translations are used in the Suspend User modal dialog (admin function).
    suspend_user:
      display_message: Display message for user
      indefinitely_label: Suspended indefinitely
      limited_time_days_text: " days"
      limited_time_label: Suspended for a limited time...
      not_suspended_label: Not suspended
      placeholder_optional: Optional
      reason: Reason for suspension
      status_heading: Suspension Status
      submit_button: => core.ref.save_changes
      title: "Suspend {username}"

    # These translations are displayed as tooltips for user badges.
    user_badge:
      suspended_tooltip: إيقاف

    # These translations are found on the user profile page (admin function).
    user_controls:
      suspend_button: Suspend

  # Translations in this namespace are used by suspension email notifications
  email:
    no_reason_given: لم يتم توضيح سبب إيقاف الحساب
    suspended:
      subject: للأسف تم إيقاف حسابك بالمجتمع
      plain:
        body: |
          تم إيقاف حسابك بسبب:

          ---
          {suspension_message}
          ---
      html:
        body: "تم إيقاف حسابك في {forumTitle} بسبب:"

    unsuspended:
      subject: تم تفعيل حسابك بالمجتمع
      plain:
        body: |
          تم تفعيل حسابك يمكنك الدخول إلى المجتمع من الرابط:

          {forum_url}
      html:
        body: "تم تفعيل حسابك ويمكنك الاستمرار في استخدام [{forumTitle}]({forum_url})"

  # Translations in this namespace are used by the forum and admin interfaces.
  lib:

    # These translations are used by gambits. Gambit keys must be in snake_case, no spaces.
    gambits:
      users:
        suspended:
          key: إيقاف
