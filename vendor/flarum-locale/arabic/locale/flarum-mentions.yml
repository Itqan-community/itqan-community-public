flarum-mentions:

  ##
  # UNIQUE KEYS - The following keys are used in only one location each.
  ##

  # Translations in this namespace are used by the forum user interface.
  forum:

    # These translations are used by the composer (reply autocompletion function).
    composer:
      mention_tooltip: الإشارة إلى مستخدم أو مشاركة
      reply_to_post_text: "التعليق على #{number}"

    # These translations are used by the mentioned by modal dialog.
    mentioned_by:
      title: الرد على التعليق
      load_more_button: => core.ref.load_more

    # These translations are used by the Notifications dropdown, a.k.a. "the bell".
    notifications:
      others_text: => core.ref.some_others
      post_mentioned_text: "{username} رد على مشاركتك"  # Can be pluralized to agree with the number of users!
      user_mentioned_text: "{username} أشار إليك"
      group_mentioned_text: "{username} أشار إلى مجموعة أنت فيها"

    # These translations are displayed beneath individual posts.
    post:
      mentioned_by_more_text: "{count, plural, zero {لا ردود إضافية} one {رد إضافي واحد} two {ردان إضافيان} few {# ردود إضافية} many {# رداً إضافياً} other {# رد إضافي}}"
      mentioned_by_self_text: "{users} رد على التعليق"  # Can be pluralized to agree with the number of users!
      mentioned_by_text: "{users} رد على تعليقك"       # Can be pluralized to agree with the number of users!
      others_text: => core.ref.some_others
      quote_button: اقتباس
      reply_link: => core.ref.reply
      you_text: => core.ref.you

    # These translations are used in the Settings page.
    settings:
      notify_post_mentioned_label: رد جديد على تعليقك
      notify_user_mentioned_label: الإشارة إليك في تعليق
      notify_group_mentioned_label: الإشارة إلى مجموعة أنت عضو فيها

    # These translations are used in the user profile page and profile popup.
    user:
      mentions_link: إشارات

    # These translations are used in the post mentions
    post_mention:
      deleted_text: "[unknown]"

    group_mention:
      deleted_text: "[unknown group]"

  # Translations in this namespace are used in emails sent by the forum.
  email:

    # These translations are used in emails sent when a post is replied to
    post_mentioned:
      subject: "{replier_display_name} رد عليك في {title}"
      plain:
        body: |
          {replier_display_name} رد على مشاركتك (#{post_number}) في {title}.

          {url}

          ---

          {content}
      html:
        body: "{replier_display_name} رد على مشاركتك (#{post_number}) في [{title}]({url})."

    # These translations are used in emails sent when a user is mentioned
    user_mentioned:
      subject: "{mentioner_display_name} أشار إليك في {title}"
      plain:
        body: |
          {mentioner_display_name} أشار إليك في التعليق {title}.

          {url}

          ---

          {content}
      html:
        body: "{mentioner_display_name} أشار إليك في التعليق [{title}]({url})."
    # These translations are used in emails sent when a group is mentioned
    group_mentioned:
      subject: "{mentioner_display_name} أشار إلى محموعة أنت فيها في {title}"
      plain:
        body: |
          {mentioner_display_name} أشار إلى محموعة أنت فيها في {title}.

          {url}

          ---

          {content}
      html:
        body: "{mentioner_display_name} أشار إلى محموعة أنت فيها في [{title}]({url})."

  # Translations in this namespace are used by the forum and admin interfaces.
  lib:

    # These translations are used by gambits. Gambit keys must be in snake_case, no spaces.
    gambits:
      posts:
        mentioned:
          key: mentioned
          hint: The ID or username of the mentioned user