# Staging-only nginx compression.
#
# nginx's default `gzip_types` is `text/html` only, so the forum's JS bundles
# (forum.js is ~1 MB), the CSS bundles and the JSON API responses were all sent
# uncompressed. On a path that throttles throughput, that is the difference
# between a usable and an unusable test environment.
#
# Installed by .github/workflows/deploy-staging.yml as
# /etc/nginx/conf.d/zz-flarum-compression.conf.
#
# Production does not need this: it sits behind Cloudflare, which compresses
# (and speaks HTTP/2-3) at the edge.

gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml;
